[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-price-action"
version = "0.3.2"
description = "Public v0.3.2 crypto runtime preserved while NASERI MARKETS platform is developed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.8",
    "SQLAlchemy[asyncio]==2.1.4",
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    # Test-only dependencies.  The public corpus imports them through
    # ``pytest.importorskip`` in 36 modules, so leaving them out of the declared
    # development environment turned hundreds of security/crypto and
    # four-language worker tests into silent skips instead of executed checks.
    "cryptography==46.0.3",
    "pyarrow==26.0.0",
    "pyproject-hooks==1.3.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "wasmtime==49.0.0",
]

[project.scripts]
crypto-signal-bot = "app.main:cli"

[tool.setuptools.packages.find]
where = ["production_source"]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
# The corpus imports both the frozen product package (``app``) and the preview
# platform package (``naseri_markets``) from the repository root; keep the root
# importable for a plain ``pytest`` invocation, not only for ``python -m pytest``.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
