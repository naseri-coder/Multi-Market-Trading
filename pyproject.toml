[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-price-action"
version = "0.2.0"
description = "Public source snapshot of a rule-based cryptocurrency price action signal system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "matplotlib==3.10.6",
    "numpy==2.5.2",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.8",
    "SQLAlchemy[asyncio]==2.0.52",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[project.scripts]
crypto-signal-bot = "app.main:cli"

[tool.setuptools.packages.find]
where = ["production_source"]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
