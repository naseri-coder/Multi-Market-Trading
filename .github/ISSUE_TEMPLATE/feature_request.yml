name: Feature request
description: Propose an engineering or project improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Explain the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analysis / rule engine
        - Testing / validation
        - Explainability
        - Paper / shadow evaluation
        - Persistence / database
        - Installer / Docker
        - CI / security
        - Documentation
        - Contributor experience
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Links, examples, or test scenarios that clarify the request.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: I understand this project does not guarantee profitability or production/live-trading readiness.
          required: true
