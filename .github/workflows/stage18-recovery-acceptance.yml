name: Stage 18 offline reconciliation and crash recovery acceptance

on:
  pull_request:
    paths:
      - 'naseri_markets/operational_reconciliation_v1.py'
      - 'naseri_markets/offline_recovery_review_v1.py'
      - 'scripts/mmt_stage18_reconcile.py'
      - 'tests/unit/test_operational_reconciliation_v1.py'
      - 'docs/OPERATIONAL_RECONCILIATION_RECOVERY_STAGE18_V1.md'
      - '.github/workflows/stage18-recovery-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify legacy/publication boundary
        run: |
          set -Eeuo pipefail
          python scripts/a6_release_preflight.py
          bash scripts/verify.sh
      - name: Focused lint and offline fault tests (including real child crash)
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/operational_reconciliation_v1.py \
            naseri_markets/offline_recovery_review_v1.py \
            scripts/mmt_stage18_reconcile.py \
            tests/unit/test_operational_reconciliation_v1.py
          mkdir -p "$RUNNER_TEMP/stage18-tests"
          cp tests/unit/test_offline_runtime_supervisor_v1.py \
             "$RUNNER_TEMP/stage18-tests/test_stage17_fixture.py"
          cp tests/unit/test_operational_reconciliation_v1.py \
             "$RUNNER_TEMP/stage18-tests/test_operational_reconciliation_v1.py"
          python -m pytest -q "$RUNNER_TEMP/stage18-tests/"
