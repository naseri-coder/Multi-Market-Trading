name: CERT-A19-R18 signed apko offline dependency closure and APK byte custody (nonproduction)

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r18-solver.yml"

permissions:
  contents: read
  actions: read

jobs:
  authenticated-solver-and-apk-closure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cert-a19-byte-audit-run' && github.repository == 'naseri-coder/Multi-Market-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify source-pinned and signed apko v1.4.11 release BEFORE executable use
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r18"
          mkdir -m 0700 "$work"
          base='https://github.com/chainguard-dev/apko/releases/download/v1.4.11'
          for suffix in '' .crt .sig; do
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 1 --connect-timeout 15 --max-time 90 \
              "$base/apko_1.4.11_linux_amd64.tar.gz$suffix" \
              -o "$work/apko-release.tar.gz$suffix"
          done
          echo '5445ea2467a4ab0db3e31d9f795133128d0564c7afdaa46fcdaa1ee3cf92c757  '"$work/apko-release.tar.gz" | sha256sum --check --status
          cosign verify-blob \
            --certificate "$work/apko-release.tar.gz.crt" \
            --signature "$work/apko-release.tar.gz.sig" \
            --certificate-identity='https://github.com/chainguard-dev/apko/.github/workflows/release.yaml@refs/heads/main' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "$work/apko-release.tar.gz" > "$work/apko-sigstore-proof.log"
          python3 - <<'PY'
          import io, os, pathlib, tarfile
          work=pathlib.Path(os.environ["RUNNER_TEMP"])/"cert-a19-r18"
          with tarfile.open(work/"apko-release.tar.gz","r:gz") as ar:
              matches=[m for m in ar if m.isfile() and pathlib.PurePosixPath(m.name).name=="apko"]
              if len(matches)!=1 or not 15_000_000<matches[0].size<150_000_000:
                  raise ValueError("R18_AMBIGUOUS_OR_UNBOUNDED_APKO_BINARY")
              file=ar.extractfile(matches[0])
              if file is None: raise ValueError("R18_APKO_BINARY_NOT_READABLE")
              p=work/"apko"
              p.write_bytes(file.read(150_000_001))
              p.chmod(0o700)
          PY
          "$work/apko" version > "$work/apko-version.txt"
          grep -F '1.4.11' "$work/apko-version.txt"
          echo APKO_RELEASE_SIGSTORE_VERIFIED > "$work/apko-verified.status"
          echo R18_SIGNED_APKO_RELEASE_AUTHENTICATED
      - name: Download EXACT R17 archived signed APKINDEX bytes, without contacting live APKINDEX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r18"
          mkdir -p "$work/artifact"
          gh run download 38637717187 \
            --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r17-apkv2-control-signature-integrity \
            --dir "$work/artifact"
          test -f "$work/artifact/APKINDEX.tar.gz"
          cp "$work/artifact/APKINDEX.tar.gz" "$work/APKINDEX.tar.gz"
          echo '8011fbdaf70278ae83e3729dc2c44a8148a91cf03ea0ef7a3d049e30a65e36a5  '"$work/APKINDEX.tar.gz" | sha256sum --check --status
          mkdir -p "$work/localrepo/x86_64"
          cp "$work/APKINDEX.tar.gz" "$work/localrepo/x86_64/APKINDEX.tar.gz"
          echo R18_IMMUTABLE_R17_SIGNED_INDEX_BYTES_RESTORED
      - name: Reverify exact Wolfi OCI base and its trusted keyring WITHOUT running image
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r18"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          cosign verify \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --certificate-identity='https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main' \
            "$image" > "$work/base-signer.log"
          printf '%s\n' "$image" > "$work/base.txt"
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create --pull=never --platform linux/amd64 --entrypoint=/bin/true "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          docker cp "$cid:/etc/apk/keys" "$work/keys"
          docker cp "$cid:/etc/apk/repositories" "$work/repositories"
          grep -Fx 'https://apk.cgr.dev/chainguard' "$work/repositories"
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          printf 'file:///mnt/apkrepo\n' > "$work/native-repos"
          echo R18_SIGNED_BASE_KEYS_STORED_FROM_CREATED_NOT_STARTED_CONTAINER
      - name: Authenticate original local R17 index again using native signed-base APK tool
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r18"
          image="$(cat "$work/base.txt")"
          if ! docker run --rm --pull=never --platform linux/amd64 \
            --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=36 --memory=220m --user=65534:65534 \
            --mount type=bind,src="$work/localrepo",dst=/mnt/apkrepo,readonly \
            --mount type=bind,src="$work/native-repos",dst=/mnt/repos,readonly \
            --entrypoint /sbin/apk "$image" \
            --no-cache --no-progress --keys-dir /etc/apk/keys \
            --repositories-file /mnt/repos search -x busybox \
            > "$work/signed-index-native.log" 2> "$work/signed-index-native.err"; then
            tail -n 100 "$work/signed-index-native.err" >&2
            exit 1
          fi
          if grep -Eiq 'untrusted|bad signature|error:|warning:' "$work/signed-index-native.err"; then
            echo R18_INDEX_SIGNATURE_FAILURE >&2
            exit 1
          fi
          grep -E '^busybox-[0-9]' "$work/signed-index-native.log" | head -n 1
          echo SIGNED_R17_INDEX_NATIVE_ACCEPTED > "$work/index-verified.status"
      - name: Run ONLY verified apko SHOW-PACKAGES against local R17 index, never build Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r18"
          python3 - <<'PY'
          import os
          from pathlib import Path
          work=Path(os.environ["RUNNER_TEMP"])/"cert-a19-r18"
          keys=sorted((work/"keys").glob("*.pub"))
          if not 1<=len(keys)<=10: raise ValueError("R18_SIGNED_BASE_KEYSET_MISSING")
          config=["contents:","  repositories:","    - "+str(work/"localrepo"),"  keyring:"]
          config.extend("    - "+str(k) for k in keys)
          config.extend(["  packages:","    - glibc-2.44=2.44-r8",
              "    - python-3.12=3.12.15-r3","    - python-3.12-base=3.12.15-r3",
              "    - nodejs-24=24.22.0-r0","archs:","  - x86_64",
              "entrypoint:","  command: /bin/true"])
          (work/"candidate.yaml").write_text("\n".join(config)+"\n")
          PY
          "$work/apko" show-packages --arch x86_64 --format 'name=version' \
            "$work/candidate.yaml" > "$work/show-packages.txt" 2> "$work/apko-solver.stderr"
          test -s "$work/show-packages.txt"
          python3 -m scripts.ci_cert_a19_r18_closure resolve
      - name: Fetch and independently inspect EVERY solver-selected APK legacy index/control/data chain
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.ci_cert_a19_r18_closure verify
      - name: Upload immutable-index and evidence only, never upload software archives
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r18-apko-signed-offline-closure-audit
          path: |
            ${{ runner.temp }}/cert-a19-r18/APKINDEX.tar.gz
            ${{ runner.temp }}/cert-a19-r18/r18-resolver.json
            ${{ runner.temp }}/cert-a19-r18/r18-result.json
            ${{ runner.temp }}/cert-a19-r18/apko-version.txt
            ${{ runner.temp }}/cert-a19-r18/apko-solver.stderr
            ${{ runner.temp }}/cert-a19-r18/show-packages.txt
          if-no-files-found: ignore
          retention-days: 2
