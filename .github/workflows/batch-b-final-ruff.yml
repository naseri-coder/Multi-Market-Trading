name: Batch B Final Ruff Fixes

on:
  push:
    branches:
      - server-full-convergence-r3-b-chat-r1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ruff==0.16.9"
      - name: Fix exact final Ruff set
        run: |
          set -Eeuo pipefail
          files=(
            scripts/phase_4_2_41_85_forward_replay.py
            scripts/phase_4_2_41_86_build_bootstrap_candidates.py
            scripts/phase_4_2_41_86_forward_bootstrap.py
            scripts/phase_4_2_41_86_freeze_bootstrap.py
            scripts/phase_4_2_41_86_walk_forward.py
            scripts/phase_4_2_41_88b_build_candidates.py
            scripts/phase_4_2_41_88b_forward_replay.py
            scripts/phase_4_2_41_88c_build_candidates.py
            scripts/phase_4_2_41_88c_forward_replay.py
          )
          python -m ruff check --select I001,F401,UP017,SIM114,SIM108 --fix --unsafe-fixes "${files[@]}"
          python -m ruff format "${files[@]}"
      - name: Commit exact fixes
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "NO_FINAL_RUFF_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --             scripts/phase_4_2_41_85_forward_replay.py             scripts/phase_4_2_41_86_build_bootstrap_candidates.py             scripts/phase_4_2_41_86_forward_bootstrap.py             scripts/phase_4_2_41_86_freeze_bootstrap.py             scripts/phase_4_2_41_86_walk_forward.py             scripts/phase_4_2_41_88b_build_candidates.py             scripts/phase_4_2_41_88b_forward_replay.py             scripts/phase_4_2_41_88c_build_candidates.py             scripts/phase_4_2_41_88c_forward_replay.py
          git diff --cached --check
          git commit -m "SERVER-GITHUB Batch B: clear final Ruff style debt"
          git push origin HEAD:server-full-convergence-r3-b-chat-r1
