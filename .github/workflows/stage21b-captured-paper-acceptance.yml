name: Stage 21B captured REPLAY PAPER E2E

on:
  pull_request:
    paths:
      - 'naseri_markets/captured_paper_pilot_stage21b_v1.py'
      - 'naseri_markets/captured_paper_cli_stage21b_v1.py'
      - 'naseri_markets/offline_panel_paper_integration_v1.py'
      - 'naseri_markets/offline_runtime_supervisor_v1.py'
      - 'naseri_markets/job_effect_intent_v1.py'
      - 'tests/unit/test_captured_paper_pilot_stage21b_v1.py'
      - 'tests/unit/test_captured_paper_cli_stage21b_v1.py'
      - 'docs/CAUSAL_CAPTURED_PAPER_STAGE21B_V1.md'
      - '.github/workflows/stage21b-captured-paper-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage21b-clean-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Source and legacy release preservation
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/captured_paper_pilot_stage21b_v1.py \
            naseri_markets/captured_paper_cli_stage21b_v1.py \
            naseri_markets/offline_panel_paper_integration_v1.py \
            naseri_markets/offline_runtime_supervisor_v1.py \
            naseri_markets/job_effect_intent_v1.py \
            tests/unit/test_captured_paper_pilot_stage21b_v1.py \
            tests/unit/test_captured_paper_cli_stage21b_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Actual durable replay risk and lifecycle acceptance
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage21b-tested"
          cp tests/unit/test_captured_paper_pilot_stage21b_v1.py \
            tests/unit/test_captured_paper_cli_stage21b_v1.py \
            tests/unit/test_stage19_integrated_effects_v1.py \
            tests/unit/test_unified_paper_pilot_stage20_v1.py \
            "$RUNNER_TEMP/stage21b-tested/"
          python -m pytest -q "$RUNNER_TEMP/stage21b-tested" -rs
      - name: Isolated Python 3.12 installed-wheel acceptance
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage21b-project" "$RUNNER_TEMP/stage21b-wheel" \
            "$RUNNER_TEMP/stage21b-room" "$RUNNER_TEMP/stage21b-wheel-tests"
          cp platform_release/pyproject.toml platform_release/README.md \
            "$RUNNER_TEMP/stage21b-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage21b-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage21b-venv"
          "$RUNNER_TEMP/stage21b-venv/bin/python" -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/stage21b-wheel" "$RUNNER_TEMP/stage21b-project"
          "$RUNNER_TEMP/stage21b-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/stage21b-wheel/multi_market_trading-0.4.0rc1-*.whl \
            'pytest==9.1.1'
          "$RUNNER_TEMP/stage21b-venv/bin/python" -m pip check
          cp tests/unit/test_captured_paper_pilot_stage21b_v1.py \
            tests/unit/test_captured_paper_cli_stage21b_v1.py \
            "$RUNNER_TEMP/stage21b-wheel-tests/"
          cd "$RUNNER_TEMP/stage21b-room"
          PYTHONPATH= "$RUNNER_TEMP/stage21b-venv/bin/python" -m pytest -q \
            "$RUNNER_TEMP/stage21b-wheel-tests" -rs
