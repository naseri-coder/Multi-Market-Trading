name: MARC R2 FRT Lead Reversal

on:
  pull_request:
    paths:
      - "research_layer/marc_r2_lead/**"
      - "scripts/marc_r2_frt_lead.py"
      - "tests/unit/test_marc_r2_frt_lead.py"
      - "docs/MARC_R2_FRT_LEAD_PROTOCOL.md"
      - ".github/workflows/marc-r2-frt-lead.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marc-r2-frt-lead-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  marc-r2-frt-lead:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "${{ github.workspace }}/production_source:${{ github.workspace }}"
    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewed development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen production source
        run: bash scripts/verify.sh

      - name: Run FRT Lead unit tests
        run: |
          python -m pytest -q             tests/unit/test_marc_r2_frt_lead.py             tests/unit/test_marc_r2_fresh_reversal.py             tests/unit/test_marc_backtest.py             tests/unit/test_marc_core.py

      - name: Run FRT Lead development and untouched holdout
        run: |
          rm -rf research_output/marc_r2_frt_lead_v0_3
          python scripts/marc_r2_frt_lead.py             --start 2022-01-01             --end 2026-10-01             --base-cost-bps 6             --stress-cost-bps 10             --request-delay 0.05             --output-dir research_output/marc_r2_frt_lead_v0_3

      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "research_output/marc_r2_frt_lead_v0_3/"
              "marc_r2_frt_lead_report.json"
          )
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema"] == "MARC_R2_FRT_LEAD_REVERSAL_V1"
          assert report["runtime_approval"] == "DENIED_RESEARCH_ONLY"
          assert report["setup_version"] == "MARC_R2_FRT_LEAD_REVERSAL_V0_3"
          print("MARC_R2_FRT_LEAD_AUDIT_PASS", report["final_classification"])
          PY

      - name: Upload immutable FRT Lead evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marc-r2-frt-lead-${{ github.sha }}
          path: research_output/marc_r2_frt_lead_v0_3/
          if-no-files-found: error
          retention-days: 14
