name: Stage 16 Binance Vision offline format and economics evidence

on:
  pull_request:
    paths:
      - "naseri_markets/binance_vision_archive_stage16_v1.py"
      - "naseri_markets/futures_economic_scenario_stage16_v1.py"
      - "tests/unit/test_stage16_vision_archive_and_futures_economics_v1.py"
      - "docs/STAGE16_BINANCE_VISION_AND_FUTURES_ECONOMICS_V1.md"
      - ".github/workflows/stage16-binance-archive-economics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-archive-and-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MMT_NONPRODUCTION: "1"
      MMT_PRODUCTION: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen legacy and preview release fences
        run: |
          set -Eeuo pipefail
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
      - name: Test complete offline archive/checksum and modeled economic math
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[dev]' 'pyarrow==21.0.0'
          python -m ruff check --select E4,F \
            naseri_markets/binance_vision_archive_stage16_v1.py \
            naseri_markets/futures_economic_scenario_stage16_v1.py \
            tests/unit/test_stage16_vision_archive_and_futures_economics_v1.py
          mkdir -p "$RUNNER_TEMP/stage16-isolated"
          cp tests/unit/test_stage16_vision_archive_and_futures_economics_v1.py \
             tests/unit/test_real_brooks_historical_stage15_v1.py \
             tests/unit/test_historical_pit_quality_stage12_v1.py \
             tests/unit/test_historical_data_loader_a1.py \
             tests/unit/test_data_a1_file_intake.py \
             "$RUNNER_TEMP/stage16-isolated/"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q \
            "$RUNNER_TEMP/stage16-isolated"
