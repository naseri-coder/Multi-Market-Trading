name: Materialize validated hash lock

on:
  push:
    branches:
      - enforce-hashed-dependencies

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate and verify exact hash lock
        run: |
          set -Eeuo pipefail
          bash scripts/verify_hashed_lock.sh --check --output requirements.hashed.lock
          echo "f3526b7e07e70c1c1afd7df21b59be85833566afce3ffcc678f0c6ab725aff7b  requirements.hashed.lock" | sha256sum -c -
      - name: Commit exact validated lock to branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: enforce-hashed-dependencies
        run: |
          set -Eeuo pipefail
          encoded="$(base64 -w0 requirements.hashed.lock)"
          gh api --method PUT "repos/$REPO/contents/requirements.hashed.lock" \
            -f message="Materialize validated dependency hash lock" \
            -f content="$encoded" \
            -f branch="$BRANCH" >/dev/null
