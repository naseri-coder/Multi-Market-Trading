name: Stage 28 publisher identity and quarantined signed source intake

on:
  pull_request:
    paths:
      - 'naseri_markets/publisher_package_registry_stage28_v1.py'
      - 'naseri_markets/signed_public_intake_stage27_v1.py'
      - 'tests/unit/test_publisher_package_registry_stage28_v1.py'
      - 'docs/PUBLISHER_IDENTITY_AND_QUARANTINE_STAGE28_V1.md'
      - '.github/workflows/stage28-publisher-quarantine-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage28-publisher-and-package-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Public source safety and static type-bound interface checks
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9' 'cryptography==46.0.3'
          python -m ruff check --select E4,F \
            naseri_markets/publisher_package_registry_stage28_v1.py \
            naseri_markets/signed_public_intake_stage27_v1.py \
            tests/unit/test_publisher_package_registry_stage28_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Stage28 publisher and Stage22–27 full affected regression
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage28-tests"
          cp tests/unit/test_publisher_package_registry_stage28_v1.py \
             tests/unit/test_signed_public_intake_stage27_v1.py \
             tests/unit/test_public_candidate_lock_stage26_v1.py \
             tests/unit/test_preinstall_evidence_stage25_v1.py \
             tests/unit/test_host_observation_custody_stage24_v1.py \
             tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage28-tests/"
          python -m pytest -q "$RUNNER_TEMP/stage28-tests" -rs
      - name: Clean installed Python3.12 wheel with security fixtures
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage28-project" "$RUNNER_TEMP/stage28-wheel" \
             "$RUNNER_TEMP/stage28-room" "$RUNNER_TEMP/stage28-installed-tests"
          cp platform_release/pyproject.toml platform_release/README.md \
             "$RUNNER_TEMP/stage28-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage28-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage28-venv"
          "$RUNNER_TEMP/stage28-venv/bin/python" -m pip wheel --no-deps \
             --wheel-dir "$RUNNER_TEMP/stage28-wheel" "$RUNNER_TEMP/stage28-project"
          "$RUNNER_TEMP/stage28-venv/bin/python" -m pip install \
             "$RUNNER_TEMP"/stage28-wheel/multi_market_trading-0.4.0rc1-*.whl \
             'pytest==9.1.1' 'cryptography==46.0.3'
          "$RUNNER_TEMP/stage28-venv/bin/python" -m pip check
          cp tests/unit/test_publisher_package_registry_stage28_v1.py \
             tests/unit/test_signed_public_intake_stage27_v1.py \
             tests/unit/test_public_candidate_lock_stage26_v1.py \
             tests/unit/test_preinstall_evidence_stage25_v1.py \
             tests/unit/test_host_observation_custody_stage24_v1.py \
             tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage28-installed-tests/"
          cd "$RUNNER_TEMP/stage28-room"
          PYTHONPATH= "$RUNNER_TEMP/stage28-venv/bin/python" -m pytest -q \
             "$RUNNER_TEMP/stage28-installed-tests" -rs
