name: Publication safety

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-publication-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen release
        run: bash scripts/verify.sh
      - name: Check tracked publication content
        run: python3 scripts/check_publication_safety.py
      - name: Verify pinned production image builds
        run: docker build --file Dockerfile.production --tag crypto-price-action:ci .
      - name: Verify installer bootstrap behavior
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp .env.example "$work/.env.example"
          if python3 scripts/bootstrap_env.py "$work/.env" "$work/.env.example" </dev/null; then
            echo "BOOTSTRAP_NONINTERACTIVE_REFUSAL_FAIL" >&2
            exit 1
          fi
          test ! -e "$work/.env"
          echo "BOOTSTRAP_NONINTERACTIVE_REFUSAL_PASS"
      - name: Verify Python package discovery
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps .
          python3 - <<'PY'
          import app
          import importlib.util
          assert importlib.util.find_spec("app.main") is not None
          print("PACKAGE_DISCOVERY_PASS")
          PY
      - name: Verify OSS metadata
        run: |
          set -Eeuo pipefail
          test -s LICENSE
          grep -Fq 'Apache License' LICENSE
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test -s docs/OSS_PUBLICATION_REVIEW.md
