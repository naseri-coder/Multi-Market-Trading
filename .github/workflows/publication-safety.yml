name: Publication safety

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - develop/v0.3.0

permissions:
  contents: read
  checks: read

jobs:
  static-publication-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure verified Docker Hub image access on disposable CI runner
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci_configure_docker_mirror.sh

      - name: Verify v0.2.0 release baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release_baseline.py
      - name: Verify frozen release
        run: bash scripts/verify.sh
      - name: Check tracked publication content
        run: python3 scripts/check_publication_safety.py
      - name: Install locked runtime dependencies for regression harness
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements.hashed.lock
      - name: Verify async I/O behavior regression baseline
        run: PYTHONPATH=production_source python3 production_checks/verify_async_io_behavior_regression.py
      - name: Verify pinned production image builds
        run: docker build --file Dockerfile.production --tag crypto-price-action:ci .
      - name: Verify reproducible dependency hash lock
        run: bash scripts/verify_hashed_lock.sh --check --output requirements.hashed.generated.lock
      - name: Upload generated dependency hash lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-hashed-lock-validation
          path: requirements.hashed.generated.lock
          if-no-files-found: error
          retention-days: 1
      - name: Verify installer bootstrap behavior
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp .env.example "$work/.env.example"
          if python3 scripts/bootstrap_env.py "$work/.env" "$work/.env.example" </dev/null; then
            echo "BOOTSTRAP_NONINTERACTIVE_REFUSAL_FAIL" >&2
            exit 1
          fi
          test ! -e "$work/.env"
          echo "BOOTSTRAP_NONINTERACTIVE_REFUSAL_PASS"
      - name: Verify Python package discovery
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps .
          python3 - <<'PY'
          import app
          import importlib.util
          assert importlib.util.find_spec("app.main") is not None
          print("PACKAGE_DISCOVERY_PASS")
          PY
      - name: Verify OSS metadata
        run: |
          set -Eeuo pipefail
          test -s LICENSE
          grep -Fq 'Apache License' LICENSE
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test -s docs/OSS_PUBLICATION_REVIEW.md
          test -s docs/RELEASE_BASELINE.md
      - name: Require companion PR checks
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_require_companion_checks.py
