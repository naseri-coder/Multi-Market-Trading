name: Batch B Ruff targeted fixes

on:
  push:
    branches:
      - server-full-convergence-r3-b-chat-r1

permissions:
  contents: write

jobs:
  targeted-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9

      - name: Apply semantics-preserving targeted fixes
        env:
          BASE_SHA: 409fe40636929e80325bbec1bc760da2ecd7835c
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- '*.py')
          test "${#files[@]}" -gt 0
          ruff check --select B905,B023,F841 --fix --unsafe-fixes "${files[@]}" || true
          ruff format "${files[@]}"

      - name: Commit targeted fixes
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "NO_TARGETED_FIX_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --check
          git commit -m "SERVER-GITHUB Batch B: apply targeted Ruff fixes"
          git push origin HEAD:server-full-convergence-r3-b-chat-r1
