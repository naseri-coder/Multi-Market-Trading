name: Batch B Ruff formatter

on:
  push:
    branches:
      - server-full-convergence-r3-b-chat-r1

permissions:
  contents: write

jobs:
  format-batch-b:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.9 autopep8==2.3.2
      - name: Format and safe-fix changed Python files only
        env:
          BASE_SHA: 409fe40636929e80325bbec1bc760da2ecd7835c
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- '*.py')
          test "${#files[@]}" -gt 0
          autopep8 --in-place --aggressive --max-line-length 100 "${files[@]}"
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          ruff check "${files[@]}" || true
      - name: Commit formatter output
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "NO_FORMAT_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "SERVER-GITHUB Batch B: format changed Python paths"
          git push origin HEAD:server-full-convergence-r3-b-chat-r1
