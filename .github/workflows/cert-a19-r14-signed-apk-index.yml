name: CERT-A19-R14 signed Wolfi APKINDEX and package candidate custody

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r14-signed-apk-index.yml"

permissions:
  contents: read

jobs:
  signed-apk-index-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cert-a19-byte-audit-run' && github.repository == 'naseri-coder/Multi-Market-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify immutable public Wolfi image signature and inspect only stopped rootfs
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r14"
          mkdir -m 0700 "$work"
          base='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$base" > "$work/cosign-verify.log"
          echo SIGNED_IMAGE_DIGEST_AND_IDENTITY_VERIFIED > "$work/cosign-status.txt"
          printf '%s\n' "$base" > "$work/oci-base.txt"
          docker pull --platform linux/amd64 "$base"
          cid="$(docker create --pull=never --platform linux/amd64 --entrypoint=/bin/true "$base")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          docker cp "$cid:/etc/apk/repositories" "$work/base-repositories"
          docker cp "$cid:/etc/apk/keys" "$work/keydir"
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          echo R14_SOURCE_IMAGE_NOT_STARTED_AND_BASE_KEYRING_CUSTODY_CAPTURED
      - name: Authenticate EXACT downloaded Wolfi APK index with native apk-tools
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r14"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.ci_cert_a19_r14_signed_apk_index import exact_repository
          work=Path(os.environ["RUNNER_TEMP"])/"cert-a19-r14"
          repo=exact_repository(work)
          (work/"base-url.txt").write_text(repo+"\n")
          print("R14_SOURCE_REPO_FROM_VERIFIED_IMAGE="+repo)
          PY
          repo="$(cat "$work/base-url.txt")"
          mkdir -p "$work/localrepo/x86_64"
          curl --proto '=https' --proto-redir '=https' \
            --fail --location --silent --show-error --retry 1 \
            --connect-timeout 15 --max-time 90 \
            "$repo/x86_64/APKINDEX.tar.gz" -o "$work/localrepo/x86_64/APKINDEX.tar.gz"
          test -s "$work/localrepo/x86_64/APKINDEX.tar.gz"
          size="$(stat -c%s "$work/localrepo/x86_64/APKINDEX.tar.gz")"
          test "$size" -ge 5000 && test "$size" -le 30000000
          cp "$work/localrepo/x86_64/APKINDEX.tar.gz" "$work/APKINDEX.tar.gz"
          printf 'file:///mnt/apkrepo\n' > "$work/native-repositories"
          base="$(cat "$work/oci-base.txt")"
          # Only Wolfi's signed, digest-pinned native APK verifier runs.
          # No arbitrary user/Worker source, package install, container network,
          # capabilities, host filesystem writes or Dockerfile builds permitted.
          docker run --rm --pull=never --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=32 --memory=192m --user=65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,size=24m,mode=1777 \
            --mount type=bind,src="$work/localrepo",dst=/mnt/apkrepo,readonly \
            --mount type=bind,src="$work/native-repositories",dst=/mnt/repositories,readonly \
            --entrypoint /sbin/apk "$base" \
            --root /tmp --initdb --no-cache --no-progress --arch x86_64 \
            --keys-dir /etc/apk/keys --repositories-file /mnt/repositories \
            update 2>&1 | tee "$work/apk-verify.log"
          if grep -Ei 'UNTRUSTED|BAD signature|WARNING:|unavailable|ERROR:|ignoring' "$work/apk-verify.log"; then
            echo "R14_NATIVE_APK_INDEX_VERIFICATION_FAILED" >&2; exit 1
          fi
          grep -E '[0-9]+ distinct packages available' "$work/apk-verify.log"
          echo APK_TOOLS_SIGNED_INDEX_ACCEPTED_NO_ALLOW_UNTRUSTED > "$work/apk-index-verification-status.txt"
          echo "R14_NATIVE_SIGNED_INDEX_ACCEPTED_NO_APK_INSTALLED"
      - name: Freeze exact signed-index package candidates without installing APK
        run: |
          set -Eeuo pipefail
          python3 -m scripts.ci_cert_a19_r14_signed_apk_index
          test -s "$RUNNER_TEMP/cert-a19-r14-index-custody.json"
      - name: Upload bounded non-authorizing R14 manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r14-signed-wolfi-index-candidate-versions
          path: ${{ runner.temp }}/cert-a19-r14-index-custody.json
          if-no-files-found: ignore
          retention-days: 2
