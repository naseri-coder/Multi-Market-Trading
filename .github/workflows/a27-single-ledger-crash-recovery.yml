name: A27 Multi Market Trading single-ledger crash recovery

on:
  push:
    branches: [feature/a27-single-ledger-crash-recovery]
  pull_request:
    paths:
      - "naseri_markets/a22_custom_bridge.py"
      - "naseri_markets/a27_unified_ledger.py"
      - "tests/unit/test_a27_unified_ledger.py"
      - "docs/MULTI_MARKET_TRADING_A27_CRASH_RECOVERY.md"
      - ".github/workflows/a27-single-ledger-crash-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a27-crash-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Immutable historical source and actual Linux sandbox prerequisites
        run: |
          set -Eeuo pipefail
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
          test "$GITHUB_ACTIONS" = true
          test "$(id -u)" -ne 0
          test -f /sys/fs/cgroup/cgroup.controllers
          test -x /usr/bin/sudo
          test -x /usr/bin/systemd-run
          ldconfig -p | grep -F libseccomp.so.2
      - name: Single-DB SIGKILL crash and real recovery, all affected regressions
        run: |
          set -Eeuo pipefail
          python -m pip install -e ".[dev]"
          python -m pip install "cryptography==46.0.3"
          python -m pytest -q \
            tests/unit/test_a27_unified_ledger.py \
            tests/unit/test_a26_atomic_fence.py \
            tests/unit/test_a25_bundle_admission.py \
            tests/unit/test_a24_publisher_admission.py \
            tests/unit/test_a23_sandbox_adapter.py \
            tests/unit/test_a22_custom_bridge.py \
            tests/unit/test_a21_custom_contract.py \
            tests/unit/test_a8_plugin_framework.py \
            tests/unit/test_a7_replay_pipeline.py \
            tests/unit/test_a20_integration.py \
            tests/unit/test_a19_hardening.py \
            tests/unit/test_a18_guardian.py \
            tests/unit/test_a17_watchdog.py \
            tests/unit/test_a16_supervisor.py \
            tests/unit/test_a15_releases.py \
            tests/unit/test_a14_packages.py \
            tests/unit/test_a13_provisioning.py \
            tests/unit/test_a12_trust.py
      - name: Lint and static no-private-strategy-execution contract
        run: |
          set -Eeuo pipefail
          python -m ruff check --select E4,F \
            naseri_markets/a22_custom_bridge.py \
            naseri_markets/a27_unified_ledger.py \
            tests/unit/test_a27_unified_ledger.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for filename in ("naseri_markets/a22_custom_bridge.py",
                           "naseri_markets/a27_unified_ledger.py"):
              src = Path(filename).read_text()
              tree = ast.parse(src)
              banned = {"subprocess", "socket", "importlib", "runpy",
                        "requests", "httpx", "aiohttp", "pickle", "ctypes"}
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      assert all(x.name.split(".")[0] not in banned for x in n.names)
                  if isinstance(n, ast.ImportFrom):
                      assert (n.module or "").split(".")[0] not in banned
              for word in ("shell=True", "Ed25519PrivateKey",
                           "private_nyfr_core", "r0_engine",
                           "production_source"):
                  assert word not in src
          print("A27_SINGLE_LEDGER_NO_PRIVATE_CODE_PASS")
          PY
      - name: Public source-only preview excludes NYFR and encrypted/binary artifacts
        run: |
          set -Eeuo pipefail
          python -m pip install "setuptools==80.9.0" "wheel==0.45.1"
          python scripts/a6_prepare_package.py --destination "$RUNNER_TEMP/a27-public"
          test -f "$RUNNER_TEMP/a27-public/naseri_markets/a27_unified_ledger.py"
          test ! -e "$RUNNER_TEMP/a27-public/naseri_markets/private_nyfr_core.py"
          test ! -e "$RUNNER_TEMP/a27-public/naseri_markets/r0_engine.py"
          if find "$RUNNER_TEMP/a27-public" -type f \
             \( -name '*.enc' -o -name '*.age' -o -name '*.zip' \
                -o -name '*.so' -o -name '*.pyd' -o -name '*.bin' \) | grep -q .; then
            echo "A27_PRIVATE_ARTIFACT_BLOCKED"; exit 1
          fi
          echo "A27_PUBLIC_SINGLE_LEDGER_NO_NYFR_PASS"
