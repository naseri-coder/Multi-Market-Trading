name: MMT CERT-A17 remediation source review (NO RUNTIME MUTATION)

on:
  pull_request:
    paths:
      - ".github/workflows/cert-a17-remediation-review.yml"
      - "deploy/runtime_a2/a17_remediation_review.json"
      - "naseri_markets/cert_a17_remediation_review.py"
      - "tests/unit/test_cert_a17_remediation_review.py"
      - "docs/MMT_CERT_A17_REMEDIATION_RESEARCH.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-offline-evidence-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MMT_NONPRODUCTION: "1"
      PYTHONPATH: production_source:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: CERT-A17 immutable Debian version and Critical evidence review
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            pydantic-settings==2.15.0 ruff==0.16.9
          python -m ruff check \
            naseri_markets/cert_a17_remediation_review.py \
            tests/unit/test_cert_a17_remediation_review.py
          python -m naseri_markets.cert_a17_remediation_review
          python -m pytest -q -ra \
            tests/unit/test_cert_a17_remediation_review.py \
            tests/unit/test_runtime_a6_dispatch_fence.py \
            | tee "$RUNNER_TEMP/cert-a17-regression.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/cert-a17-regression.txt"; then
            echo "CERT_A17_SKIPPED_SECURITY_TEST_REFUSED" >&2
            exit 1
          fi
          echo "CERT_A17_ALL_199_FINDINGS_OPEN__NO_DEPENDENCY_MUTATION_OR_RELEASE"
