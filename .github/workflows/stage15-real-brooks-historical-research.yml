name: Stage 15 genuine frozen Brooks V5 historical research (offline)

on:
  pull_request:
    paths:
      - "naseri_markets/real_brooks_historical_stage15_v1.py"
      - "tests/unit/test_real_brooks_historical_stage15_v1.py"
      - "docs/STAGE15_REAL_BROOKS_HISTORICAL_RESEARCH_V1.md"
      - ".github/workflows/stage15-real-brooks-historical-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-reviewed-engine-historical-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MMT_NONPRODUCTION: "1"
      MMT_PRODUCTION: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Original source manifest and protected preview preflight
        run: |
          set -Eeuo pipefail
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
      - name: Run real frozen V5 worker plus independent provenance regressions
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9' 'pyarrow==21.0.0'
          python -m ruff check --select E4,F \
            naseri_markets/real_brooks_historical_stage15_v1.py \
            tests/unit/test_real_brooks_historical_stage15_v1.py
          mkdir -p "$RUNNER_TEMP/stage15-isolated"
          cp tests/unit/test_real_brooks_historical_stage15_v1.py \
             tests/unit/test_historical_pit_quality_stage12_v1.py \
             tests/unit/test_historical_data_loader_a1.py \
             tests/unit/test_data_a1_file_intake.py \
             "$RUNNER_TEMP/stage15-isolated/"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q \
            "$RUNNER_TEMP/stage15-isolated"
