name: Stage 3J - SIGNAL_ONLY and PAPER independent release-scope acceptance

on:
  push:
    branches:
      - ci/stage3j-signal-paper-scope-20261018
    paths:
      - .github/workflows/stage3j-signal-paper-scope.yml
      - docs/MMT_V040_STAGE3J_SIGNAL_PAPER_SCOPE_DECISION.md
      - tests/unit/test_stage3j_signal_only_paper_scope.py

permissions:
  contents: read

jobs:
  scoped-signal-and-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      APP_ENV: test
      MMT_NONPRODUCTION: "1"
      TELEGRAM_RUNTIME_ENABLED: "false"
      MMT_LIVE_ENABLED: "false"

    steps:
      - name: Checkout isolated branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/stage3j-signal-paper-scope-20261018
          fetch-depth: 2
          persist-credentials: false

      - name: Require same untouched original platform source, LIVE and package metadata
        run: |
          set -Eeuo pipefail
          BASE=7bbb3541fb6d63f960bee9f197fe026ed6d04608
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git branch --show-current)" = "ci/stage3j-signal-paper-scope-20261018"
          test "$(git rev-parse HEAD:naseri_markets)" = "$(git rev-parse "$BASE:naseri_markets")"
          test "$(git rev-parse HEAD:production_source)" = "$(git rev-parse "$BASE:production_source")"
          test "$(git rev-parse HEAD:platform_release)" = "$(git rev-parse "$BASE:platform_release")"
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/stage3j-signal-paper-scope.yml",
              "docs/MMT_V040_STAGE3J_SIGNAL_PAPER_SCOPE_DECISION.md",
              "tests/unit/test_stage3j_signal_only_paper_scope.py",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines())
          assert actual == expected, actual
          print("STAGE3J_ORIGINAL_PRODUCT_AND_LIVE_SOURCE_UNMODIFIED_PASS")
          PY

      - name: Python 3.12 supported runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned offline test dependencies (no broker or messaging libraries)
        run: |
          set -Eeuo pipefail
          python -m pip install "pytest==9.1.1" "ruff==0.16.9"
          python -m ruff check --select E4,F --no-cache tests/unit/test_stage3j_signal_only_paper_scope.py
          python -c "import ast,pathlib; ast.parse(pathlib.Path('tests/unit/test_stage3j_signal_only_paper_scope.py').read_bytes())"

      - name: Run actual first-party core tests in NO-NETWORK kernel namespace
        run: |
          set -Eeuo pipefail
          test -z "${MMT_PRODUCTION+x}"
          sudo -n unshare --net -- runuser -u "$(id -un)" -- env -i \
            "PATH=$PATH" "HOME=$HOME" "PYTHONPATH=$GITHUB_WORKSPACE" \
            "MMT_NONPRODUCTION=1" "APP_ENV=test" \
            "PYTHONDONTWRITEBYTECODE=1" "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1" \
            "$(command -v python)" -m pytest -q -ra -c /dev/null \
            -p no:cacheprovider --tb=short \
            tests/unit/test_stage3j_signal_only_paper_scope.py \
            tests/unit/test_adapter_free_paper_runtime_v1.py \
            tests/unit/test_offline_panel_paper_integration_v1.py \
            tests/unit/test_offline_signal_lifecycle_v1.py \
            tests/unit/test_public_signal_bot.py \
            tests/unit/test_paper_demo_cli_v1.py \
            tests/unit/test_panel_paper_synthetic_demo_v1.py \
            tests/unit/test_paper_order_lifecycle_v1.py \
            tests/unit/test_paper_core_risk_bridge_v1.py
          echo "STAGE3J_SIGNAL_ONLY_AND_PAPER_OFFLINE_TEST_CORPUS_PASS"

      - name: Never imply actual user messaging or LIVE order authorization
        if: always()
        run: |
          echo "STAGE3J_NO_REAL_TELEGRAM_DELIVERY_TEST__NO_LIVE_TRADING_TEST_OR_AUTHORIZATION"
