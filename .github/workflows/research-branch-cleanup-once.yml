# One-time cleanup: delete only audited, unapproved MARC/FM research refs.
# This file is intentionally removed in a follow-up PR after cleanup.
name: One-time MARC FM archived branch cleanup

on:
  pull_request:
    paths:
      - docs/RESEARCH_BRANCH_ARCHIVE_2026_10_11.md
      - .github/workflows/research-branch-cleanup-once.yml
  push:
    branches: [main]
    paths:
      - docs/RESEARCH_BRANCH_ARCHIVE_2026_10_11.md
      - .github/workflows/research-branch-cleanup-once.yml

permissions:
  contents: read

jobs:
  validate-archive:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate archival scope without deleting anything
        run: |
          python - <<'PY'
          from pathlib import Path
          archive = Path("docs/RESEARCH_BRANCH_ARCHIVE_2026_10_11.md").read_text(encoding="utf-8")
          assert archive.count("| `feature/marc-") == 13
          assert archive.count("| `research/fm-") == 2
          assert "main`: **PROTECTED" in archive
          assert "develop/v0.3.0`: **PROTECTED" in archive
          assert "feature/brooks-real-http-nonprod-e2e" in archive
          print("PASS: 15 explicit research archive entries, protected branches excluded")
          PY

  prune-once:
    # Never run on PRs or subsequent pushes. The squash merge title is pinned.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore: archive unapproved MARC/FM research branches')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact SHAs, closed PRs and protections; delete only pinned 15 refs
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "naseri-coder/Multi-Market-Trading", repo
          root = "https://api.github.com/repos/" + repo
          token = os.environ["GITHUB_TOKEN"]
          expected = {
              "feature/marc-ma-regime-core-v0.1": "7e583b56dffb06b16a005340d89e77dda1d63531",
              "feature/marc-oos-backtest-v0.1": "fee34cf08775797af9f8e2edaecae579e62f85f7",
              "feature/marc-r2-diagnostic-v0.1": "9db1d429ea8651b168bd736e620c8cc4d78bb2ac",
              "feature/marc-r2-causal-search-v0.1": "5a9ef5d5380dca841d6673988104c65e120fba8f",
              "feature/marc-r2-exit-repair-v0.1": "9c9e8fde49e3dfa37f0ae7881ca7a7c91e9d9143",
              "feature/marc-r2-pure-reversal-v0.1": "6c525bebae16d7a7c3f66d83a5d0f70bfaec8978",
              "feature/marc-r2-frt-cost-clean-v0.2": "38e76c146d4fa7810c9c9b4c22d0a22153157bf8",
              "feature/marc-r2-frt-execution-v0.2": "6f3513b065d6208d78ccd021bd05eae9c6aef7ea",
              "feature/marc-r2-lead-reversal-v0.3": "7c738e844a604fdcbcb48bf091f633539b3331bf",
              "feature/marc-r2-frt-lead-reversal-v0.3": "f4682b72082e1ab65d15bf3c43a0ac145303e940",
              "feature/marc-r2-short-reversal-v0.3": "38e76c146d4fa7810c9c9b4c22d0a22153157bf8",
              "feature/marc-r3-regime-instrument-qualification-v0.1": "c056ff61a71f596591697d24f6e99cd99690aa75",
              "feature/marc-r4-morphology-directional-qualification-v0.1": "41a9b84ea10b7aa1bb9d2a7536710ea4168d5b7d",
              "research/fm-one-year-top10-scan-v0.1": "a9713cf775240aeb6a260e1638a0a7ea8cbc7a46",
              "research/fm-top10-1y-15m-30m-v0.1": "6d0213b89135479b4906c66cb1774062a1b75c15",
          }
          assert len(expected) == 15
          assert all(n != "main" and not n.startswith("develop/") for n in expected)
          assert "feature/brooks-real-http-nonprod-e2e" not in expected
          archive = Path("docs/RESEARCH_BRANCH_ARCHIVE_2026_10_11.md").read_text(encoding="utf-8")
          for name, sha in expected.items():
              assert ("| `" + name + "` | `" + sha + "` |") in archive

          def api(method, path):
              req = urllib.request.Request(
                  root + path, method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mmt-one-time-research-branch-pruner",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      blob = response.read()
                      return json.loads(blob) if blob else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404 and method == "GET":
                      return None
                  raise

          open_prs = api("GET", "/pulls?state=open&per_page=100")
          if any(p["head"]["ref"] in expected for p in open_prs):
              raise RuntimeError("REFUSED: a target research branch still has an open PR")

          branches = api("GET", "/branches?per_page=100")
          present = {b["name"]: b for b in branches}
          assert all(n in present for n in ("main","develop/v0.3.0","feature/brooks-real-http-nonprod-e2e"))
          for name, sha in expected.items():
              b = present.get(name)
              if b is None:
                  continue  # idempotent re-run if already deleted
              if b["protected"] or b["commit"]["sha"] != sha:
                  raise RuntimeError("REFUSED: protected or changed research branch " + name)

          # All 15 leases and all PR states are verified before the first delete.
          for name in expected:
              if name not in present:
                  continue
              api("DELETE", "/git/refs/heads/" + urllib.parse.quote(name, safe="/"))
              print("DELETED:", name)

          last = None
          for _ in range(5):
              last = api("GET", "/branches?per_page=100")
              pending = sorted(set(expected) & {b["name"] for b in last})
              if not pending:
                  break
              time.sleep(2)
          if pending:
              raise RuntimeError("DELETE_NOT_VERIFIED: " + ", ".join(pending))
          kept = {b["name"] for b in last}
          assert {"main", "develop/v0.3.0", "feature/brooks-real-http-nonprod-e2e"} <= kept
          print("PASS: all 15 audited research branch refs absent; protected and Brooks branch preserved")
          PY
