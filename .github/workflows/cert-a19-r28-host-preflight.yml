name: CERT-A19-R28 live rootless and gVisor host preflight without guest launch

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r28-host-preflight.yml"

permissions:
  contents: read
  actions: read

jobs:
  read-only-runner-host-capability-inventory:
    if: github.repository == 'naseri-coder/Multi-Market-Trading' && github.ref == 'refs/heads/cert-a19-byte-audit-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore original R27 host-gate/fixture evidence with exact hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r28"
          mkdir -m 0700 "$d"
          mkdir -m 0700 "$d/r27-artifact"
          gh run download 38697550355 \
            --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r27-fixed-utc-and-host-gate-static \
            --dir "$d/r27-artifact"
          cp "$d/r27-artifact/r27-report.json" "$d/r27-report.json"
          cp "$d/r27-artifact/r27-vectors.json" "$d/r27-vectors.json"
          echo '818e8b3165c53404d1e33ac7bfb04d51886288b5c40b37155681f756485dcf5b  '"$d/r27-report.json" | sha256sum --check --status
          echo '6f9c7847c5029d29f0f29fe5beae94c318bfc9a8c4f7f4a6512052e667812f1d  '"$d/r27-vectors.json" | sha256sum --check --status
          echo CERT_A19_R28_FROZEN_R27_INPUTS_MATCH
      - name: Inspect real runner's CURRENT Docker daemon and gVisor presence, WITHOUT docker run
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.ci_cert_a19_r28_live_host_preflight
          test -s "$RUNNER_TEMP/cert-a19-r28/r28-host-live-preflight.json"
          test -s "$RUNNER_TEMP/cert-a19-r28/r28-fixture-host-contract.json"
          sha256sum "$RUNNER_TEMP/cert-a19-r28/r28-host-live-preflight.json" "$RUNNER_TEMP/cert-a19-r28/r28-fixture-host-contract.json"
      - name: Retain only bounded, nonsensitive read-only host facts and fixture plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r28-live-rootless-runsc-preflight
          path: |
            ${{ runner.temp }}/cert-a19-r28/r28-host-live-preflight.json
            ${{ runner.temp }}/cert-a19-r28/r28-fixture-host-contract.json
          if-no-files-found: ignore
          retention-days: 2
