name: Stage 3F - offline PAPER scope and failed provider disclosure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truthful-release-scope:
    name: Fail-closed OFFLINE/PAPER scope admission (no publication)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MMT_NONPRODUCTION: "1"
      APP_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
      TELEGRAM_RUNTIME_ENABLED: "false"
      BROOKS_RUNTIME_ENABLED: "false"
      PAPER_RUNTIME_ENABLED: "false"
      MMT_LIVE_ENABLED: "false"

    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require historical provider denial and offline-only claims
        run: |
          set -Eeuo pipefail
          test -z "${MMT_PRODUCTION+x}"
          python -m scripts.mmt_v040_stage3f_scope_gate --repository "$GITHUB_WORKSPACE"

      - name: Execute strictly isolated standard-library regression suite
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests/unit -p 'test_mmt_v040_stage3f_scope_gate.py' -v
          echo "STAGE3F_OFFLINE_PAPER_SCOPE_FALSE_CLAIM_REJECTION_PASS"

      - name: Explicit hard block on approval/publisher inference
        run: |
          set -Eeuo pipefail
          echo "STAGE3F_PUBLIC_PROVIDER_SMOKE_FAILED__NO_OFFICIAL_RELEASE_OR_LIVE"
