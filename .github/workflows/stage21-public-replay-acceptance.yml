name: Stage 21 read-only public Futures replay acceptance

on:
  pull_request:
    paths:
      - 'naseri_markets/kucoin_futures_replay_stage21_v1.py'
      - 'naseri_markets/futures_probe_stage21_v1.py'
      - 'tests/unit/test_kucoin_futures_replay_stage21_v1.py'
      - 'docs/READONLY_FUTURES_REPLAY_STAGE21A_V1.md'
      - '.github/workflows/stage21-public-replay-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage21-data-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Release and source safety
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/kucoin_futures_replay_stage21_v1.py \
            naseri_markets/futures_probe_stage21_v1.py \
            tests/unit/test_kucoin_futures_replay_stage21_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Offline-only negative tests, no public network
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage21-source-tests"
          cp tests/unit/test_kucoin_futures_replay_stage21_v1.py "$RUNNER_TEMP/stage21-source-tests/"
          python -m pytest -q "$RUNNER_TEMP/stage21-source-tests" -rs
      - name: Clean-wheel installed module acceptance
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage21-project" "$RUNNER_TEMP/stage21-wheel" \
            "$RUNNER_TEMP/stage21-room" "$RUNNER_TEMP/stage21-tests"
          cp platform_release/pyproject.toml platform_release/README.md "$RUNNER_TEMP/stage21-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage21-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage21-venv"
          "$RUNNER_TEMP/stage21-venv/bin/python" -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/stage21-wheel" "$RUNNER_TEMP/stage21-project"
          "$RUNNER_TEMP/stage21-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/stage21-wheel/multi_market_trading-0.4.0rc1-*.whl \
            'pytest==9.1.1'
          "$RUNNER_TEMP/stage21-venv/bin/python" -m pip check
          cp tests/unit/test_kucoin_futures_replay_stage21_v1.py "$RUNNER_TEMP/stage21-tests/"
          cd "$RUNNER_TEMP/stage21-room"
          PYTHONPATH= "$RUNNER_TEMP/stage21-venv/bin/python" -m pytest -q \
            "$RUNNER_TEMP/stage21-tests" -rs
