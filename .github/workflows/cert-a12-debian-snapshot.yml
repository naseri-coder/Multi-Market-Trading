name: MMT CERT-A12 Debian snapshot discovery (NO APPROVAL)

on:
  pull_request:
    paths:
      - ".github/workflows/cert-a12-debian-snapshot.yml"
      - "deploy/runtime_a2/a12_snapshot_sources.sources"
      - "deploy/runtime_a2/a12_signed_snapshot.json"
      - "deploy/runtime_a2/a12_snapshot_verify.py"
      - "docs/MMT_CERT_A12_DEBIAN_SIGNED_SNAPSHOT.md"
      - "tests/unit/test_cert_a12_signed_snapshot.py"
      - "deploy/runtime_a2/Dockerfile"
      - "deploy/runtime_a2/Dockerfile.dockerignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-actual-debian-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe ONLY digest-pinned ephemeral base (APT signed indexes and A11 closure)
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = x86_64
          docker run --rm --pull=always --platform=linux/amd64 \
            --security-opt=no-new-privileges --memory=1100m --pids-limit=128 \
            --mount="type=bind,source=$PWD/deploy/runtime_a2/a11_apt_closure.py,target=/opt/mmt/a11_apt_closure.py,readonly" \
            --mount="type=bind,source=$PWD/deploy/runtime_a2/a11_apt_closure.json,target=/opt/mmt/a11_apt_closure.json,readonly" \
            --entrypoint=/bin/sh \
            "python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258" \
            -ec '
              set -eu
              rm -f /etc/apt/sources.list.d/debian.sources
              cat > /etc/apt/sources.list.d/mmt-cert-a12.sources <<EOF
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261014T000000Z/
          Suites: bookworm bookworm-updates
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no

          Types: deb
          URIs: https://snapshot.debian.org/archive/debian-security/20261014T000000Z/
          Suites: bookworm-security
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
              echo CERT_A12_SNAPSHOT_PROBE_APT_SIGNATURES_MANDATORY
              apt-get -o Acquire::Retries=1 update -qq
              echo CERT_A12_INRELEASE_SHA256_BEGIN
              sha256sum /var/lib/apt/lists/*_InRelease | sed "s|/var/lib/apt/lists/||"
              echo CERT_A12_INRELEASE_SHA256_END
              mkdir -p /tmp/mmt-a11-apt/archives/partial
              apt-get -y -o Dir::Cache::archives=/tmp/mmt-a11-apt/archives \
                install --download-only --no-install-recommends nodejs npm > /dev/null
              python /opt/mmt/a11_apt_closure.py verify
              echo CERT_A12_SNAPSHOT_MATCHES_A11_372_DEB_HASHES
            '
  # This is discovery, NOT a Debian release approval, gVisor host certificate,
  # production release, archive custody, or Worker launch permission.
