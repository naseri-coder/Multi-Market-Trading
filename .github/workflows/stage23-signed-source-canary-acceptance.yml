name: Stage 23 signed executable candidate and disposable host canary policy

on:
  pull_request:
    paths:
      - 'naseri_markets/signed_core_candidate_stage23_v1.py'
      - 'naseri_markets/disposable_gvisor_canary_stage23_v1.py'
      - 'naseri_markets/disposable_gvisor_canary_cli_stage23_v1.py'
      - 'tests/unit/test_signed_core_candidate_stage23_v1.py'
      - 'tests/unit/test_disposable_gvisor_canary_stage23_v1.py'
      - 'docs/SIGNED_SOURCE_AND_HOST_CANARY_STAGE23_V1.md'
      - '.github/workflows/stage23-signed-source-canary-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage23-signed-source-host-canary-mocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Source and publication safety — no real host/provisioning
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9' 'cryptography==46.0.3'
          python -m ruff check --select E4,F \
            naseri_markets/signed_core_candidate_stage23_v1.py \
            naseri_markets/disposable_gvisor_canary_stage23_v1.py \
            naseri_markets/disposable_gvisor_canary_cli_stage23_v1.py \
            tests/unit/test_signed_core_candidate_stage23_v1.py \
            tests/unit/test_disposable_gvisor_canary_stage23_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Stage23+22, Stage4 isolated ABI and Stage21F regressions
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage23-tested"
          cp tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             tests/unit/test_strategy_orchestrator_v1.py \
             tests/unit/test_market_evidence_gate_stage21f_v1.py \
             tests/unit/test_public_funding_mark_stage21e_v1.py \
             tests/unit/test_public_forward_capture_stage21c_v1.py \
             tests/unit/test_paper_contract_economics_stage21d_v1.py \
             "$RUNNER_TEMP/stage23-tested/"
          python -m pytest -q "$RUNNER_TEMP/stage23-tested" -rs
      - name: Isolated installed-wheel source and canary contract
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage23-project" "$RUNNER_TEMP/stage23-wheel" \
             "$RUNNER_TEMP/stage23-room" "$RUNNER_TEMP/stage23-tests"
          cp platform_release/pyproject.toml platform_release/README.md \
             "$RUNNER_TEMP/stage23-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage23-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage23-venv"
          "$RUNNER_TEMP/stage23-venv/bin/python" -m pip wheel --no-deps \
             --wheel-dir "$RUNNER_TEMP/stage23-wheel" "$RUNNER_TEMP/stage23-project"
          "$RUNNER_TEMP/stage23-venv/bin/python" -m pip install \
             "$RUNNER_TEMP"/stage23-wheel/multi_market_trading-0.4.0rc1-*.whl \
             'pytest==9.1.1' 'cryptography==46.0.3'
          "$RUNNER_TEMP/stage23-venv/bin/python" -m pip check
          cp tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage23-tests/"
          cd "$RUNNER_TEMP/stage23-room"
          PYTHONPATH= "$RUNNER_TEMP/stage23-venv/bin/python" -m pytest -q \
             "$RUNNER_TEMP/stage23-tests" -rs
