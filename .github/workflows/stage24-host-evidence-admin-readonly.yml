name: Stage 24 signed host observation and private admin read-only acceptance

on:
  pull_request:
    paths:
      - 'naseri_markets/host_observation_custody_stage24_v1.py'
      - 'naseri_markets/integrated_engine_panel.py'
      - 'tests/unit/test_host_observation_custody_stage24_v1.py'
      - 'tests/unit/test_stage24_admin_security_status.py'
      - 'docs/STAGE24_HOST_EVIDENCE_ADMIN_READONLY_V1.md'
      - '.github/workflows/stage24-host-evidence-admin-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage24-signed-readonly-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Source checks and release safety
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'pytest-asyncio==1.4.0' \
            'ruff==0.16.9' 'cryptography==46.0.3' 'python-telegram-bot==22.8'
          python -m ruff check --select E4,F \
            naseri_markets/host_observation_custody_stage24_v1.py \
            naseri_markets/integrated_engine_panel.py \
            tests/unit/test_host_observation_custody_stage24_v1.py \
            tests/unit/test_stage24_admin_security_status.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Signed host evidence, Stage22/23 and Telegram private admin regression
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage24-tests"
          cp tests/unit/test_host_observation_custody_stage24_v1.py \
             tests/unit/test_stage24_admin_security_status.py \
             tests/unit/test_integrated_engine_panel.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             "$RUNNER_TEMP/stage24-tests/"
          python -m pytest -q "$RUNNER_TEMP/stage24-tests" -rs
      - name: Standalone installed-wheel nonproduction stage24 contract
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage24-project" "$RUNNER_TEMP/stage24-wheel" \
             "$RUNNER_TEMP/stage24-room" "$RUNNER_TEMP/stage24-wheel-tests"
          cp platform_release/pyproject.toml platform_release/README.md \
             "$RUNNER_TEMP/stage24-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage24-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage24-venv"
          "$RUNNER_TEMP/stage24-venv/bin/python" -m pip wheel --no-deps \
             --wheel-dir "$RUNNER_TEMP/stage24-wheel" "$RUNNER_TEMP/stage24-project"
          "$RUNNER_TEMP/stage24-venv/bin/python" -m pip install \
             "$RUNNER_TEMP"/stage24-wheel/multi_market_trading-0.4.0rc1-*.whl \
             'pytest==9.1.1' 'pytest-asyncio==1.4.0' \
             'cryptography==46.0.3' 'python-telegram-bot==22.8'
          "$RUNNER_TEMP/stage24-venv/bin/python" -m pip check
          cp tests/unit/test_host_observation_custody_stage24_v1.py \
             tests/unit/test_stage24_admin_security_status.py \
             tests/unit/test_integrated_engine_panel.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage24-wheel-tests/"
          cd "$RUNNER_TEMP/stage24-room"
          PYTHONPATH= "$RUNNER_TEMP/stage24-venv/bin/python" -m pytest -q \
             "$RUNNER_TEMP/stage24-wheel-tests" -rs
