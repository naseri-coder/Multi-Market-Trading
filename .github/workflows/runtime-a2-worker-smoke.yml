name: MMT-RUNTIME-A2 harmless four-language worker smoke

on:
  pull_request:
    paths:
      - "scripts/runtime_a2_worker.py"
      - "tests/unit/test_runtime_a2_worker.py"
      - "naseri_markets/multilang_runtime_a1.py"
      - "deploy/runtime_a2/Dockerfile"
      - "docs/MMT_RUNTIME_A2_WORKER_CONTAINMENT.md"
      - "scripts/ci_cert_a8_rootful_docker_smoke.py"
      - "tests/unit/test_cert_a8_ci_rootful_docker_smoke.py"
      - "docs/MMT_CERT_A8_GITHUB_HOSTED_BENIGN_DOCKER_SMOKE.md"
      - "scripts/ci_cert_a9_worker_image_inventory.py"
      - "tests/unit/test_cert_a9_worker_image_inventory.py"
      - "docs/MMT_CERT_A9_WORKER_IMAGE_INVENTORY.md"
      - "deploy/runtime_a2/a8_source_lock.json"
      - "naseri_markets/runtime_a8_supply_chain.py"
      - ".github/workflows/runtime-a2-worker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-four-language-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/production_source:${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned testing/runtime tools
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            pydantic-settings==2.15.0 ruff==0.16.9 wasmtime==49.0.0
          npm install --global --ignore-scripts typescript@5.9.3
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Check worker syntax and execute ONLY fixed harmless fixtures
        run: |
          set -Eeuo pipefail
          python -m ruff check scripts/runtime_a2_worker.py \
            tests/unit/test_runtime_a2_worker.py \
            scripts/ci_cert_a8_rootful_docker_smoke.py \
            tests/unit/test_cert_a8_ci_rootful_docker_smoke.py \
            scripts/ci_cert_a9_worker_image_inventory.py \
            tests/unit/test_cert_a9_worker_image_inventory.py \
            naseri_markets/multilang_runtime_a1.py
          python -m pytest -q -ra \
            tests/unit/test_runtime_a2_worker.py \
            tests/unit/test_cert_a8_ci_rootful_docker_smoke.py \
            tests/unit/test_cert_a9_worker_image_inventory.py \
            tests/unit/test_runtime_a8_supply_chain.py \
            tests/unit/test_runtime_a6_dispatch_fence.py \
            | tee "$RUNNER_TEMP/mmt-runtime-a2.txt"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/mmt-runtime-a2.txt"; then
            echo "RUNTIME_A2_DEPENDENCY_MISSING_OR_SKIPPED" >&2
            exit 1
          fi

  # Deliberately no hostile-code execution on the normal hosted runner.
  # Rootless + runsc isolation certification needs a separate authorized host.

  candidate-container-fixture:
    runs-on: ubuntu-24.04
    needs: actual-four-language-fixture
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/production_source:${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install fixed fixture test packages
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            pydantic-settings==2.15.0 wasmtime==49.0.0
      - name: Build nonproduction disposable candidate, no publish
        run: |
          set -Eeuo pipefail
          docker build --pull --tag mmt/runtime-a2-candidate:pr \
            --file deploy/runtime_a2/Dockerfile .
          docker image inspect mmt/runtime-a2-candidate:pr \
            --format 'CANDIDATE_IMAGE_ID={{.Id}}'
      - name: Execute ONLY committed fixtures in no-network read-only Docker
        env:
          MMT_A2_IMAGE: mmt/runtime-a2-candidate:pr
        run: |
          set -Eeuo pipefail
          python -m pytest -q -ra \
            tests/unit/test_runtime_a2_worker.py::test_exact_four_language_benign_fixture_roundtrips
          echo "DOCKER_FIXTURE_PASS__ROOTLESS_GVISOR_NOT_CERTIFIED"
      - name: CERT-A8 verify benign bounded container controls on hosted rootful Docker
        env:
          MMT_NONPRODUCTION: "1"
          MMT_CERT_A8_BENIGN_DOCKER_ONLY: "1"
        run: |
          set -Eeuo pipefail
          python -m scripts.ci_cert_a8_rootful_docker_smoke
          echo "CERT_A8_GITHUB_ROOTFUL_BENIGN_CONTAINER_ONLY_NOT_GVISOR_CERTIFIED"
      - name: CERT-A9 check installed Worker SHA and actual Python Node npm TS Wasmtime versions
        env:
          MMT_NONPRODUCTION: "1"
          MMT_CERT_A9_INSTALLED_IMAGE_ONLY: "1"
        run: |
          set -Eeuo pipefail
          python -m scripts.ci_cert_a9_worker_image_inventory
          echo "CERT_A9_INSTALLED_IMAGE_OBSERVED__EXTERNAL_PROVENANCE_NOT_VERIFIED"
