name: MARC R3 Regime Instrument Qualification

on:
  pull_request:
    paths:
      - "research_layer/marc_r3_qualification/**"
      - "scripts/marc_r3_qualification.py"
      - "tests/unit/test_marc_r3_qualification.py"
      - "docs/MARC_R3_QUALIFICATION_PROTOCOL.md"
      - ".github/workflows/marc-r3-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marc-r3-qualification-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  marc-r3-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "${{ github.workspace }}/production_source:${{ github.workspace }}"

    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewed development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen production source
        run: bash scripts/verify.sh

      - name: Run R3 qualification unit tests
        run: |
          python -m pytest -q             tests/unit/test_marc_r3_qualification.py             tests/unit/test_marc_r2_fresh_reversal.py             tests/unit/test_marc_backtest.py             tests/unit/test_marc_core.py

      - name: Run expanding walk-forward qualification
        run: |
          set -Eeuo pipefail
          rm -rf research_output/marc_r3_qualification_v0_1
          python scripts/marc_r3_qualification.py             --start 2022-01-01             --end 2026-10-01             --base-cost-bps 6             --stress-cost-bps 10             --request-delay 0.05             --output-dir research_output/marc_r3_qualification_v0_1

      - name: Verify R3 research-only and holdout contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "research_output/marc_r3_qualification_v0_1/"
              "marc_r3_qualification_report.json"
          )
          report = json.loads(path.read_text(encoding="utf-8"))

          assert report["schema"] == "MARC_R3_REGIME_INSTRUMENT_QUALIFICATION_V1"
          assert report["runtime_approval"] == "DENIED_RESEARCH_ONLY"
          assert report["protocol"]["research_symbols"] == [
              "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT",
              "ADAUSDT", "DOGEUSDT", "LINKUSDT", "LTCUSDT", "BCHUSDT",
          ]
          assert report["protocol"]["untouched_holdout_symbols"] == [
              "AVAXUSDT", "DOTUSDT", "TRXUSDT", "ATOMUSDT", "NEARUSDT",
          ]

          dev_pass = report["development"]["gate"]["passed"]
          holdout = report["untouched_cross_sectional_holdout"]
          if dev_pass:
              assert holdout is not None
          else:
              assert holdout is None

          print(
              "MARC_R3_QUALIFICATION_AUDIT_PASS",
              report["final_classification"],
          )
          PY

      - name: Upload immutable R3 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marc-r3-qualification-${{ github.sha }}
          path: research_output/marc_r3_qualification_v0_1/
          if-no-files-found: error
          retention-days: 14
