name: Public Test Corpus

on:
  pull_request:
  push:
    branches:
      - main
      - develop/v0.3.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js 22 for four-language fixture tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned TypeScript for four-language worker tests
        run: |
          set -Eeuo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund typescript@5.9.3
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          NODE_PATH="$(npm root -g)" node -e 'if (require("typescript").version !== "5.9.3") process.exit(1)'
      - name: Install public snapshot and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify v0.3.0 static release contract
        run: bash scripts/verify.sh
      - name: Materialize frozen release layout for path-contract tests
        run: |
          cp -a production_source/app ./app
          cp -a production_source/migrations ./migrations
      - name: Reject new Ruff findings
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          RUFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_ruff_no_new_debt.py --base-sha "$RUFF_BASE_SHA"
      - name: Run reviewed public unit corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
          PTB_TIMEDELTA: "1"
        run: python -m pytest -q tests/unit
