name: Public Test Corpus

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public snapshot and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Reject new Ruff findings
        if: github.event_name == 'pull_request'
        env:
          RUFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_ruff_no_new_debt.py --base-sha "$RUFF_BASE_SHA"
      - name: Materialize frozen release layout for path-contract tests
        run: |
          cp -a production_source/app ./app
          cp -a production_source/migrations ./migrations
      - name: Run reviewed public unit corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
          PTB_TIMEDELTA: "1"
        run: python -m pytest -q tests/unit
