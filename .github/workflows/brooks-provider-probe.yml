name: Brooks public futures market reachability (ephemeral read-only)
on:
  pull_request:
    paths:
      - "scripts/brooks_public_provider_probe.py"
      - ".github/workflows/brooks-provider-probe.yml"
      - "naseri_markets/brooks_kraken_feed.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  futures-provider-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Probe only independent documented public HTTP OHLCV endpoints
        run: |
          set -Eeuo pipefail
          python -m scripts.brooks_public_provider_probe
