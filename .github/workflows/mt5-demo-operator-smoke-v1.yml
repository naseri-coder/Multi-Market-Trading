name: Stage 9 MT5 DEMO Operator Read-only Smoke Gate

on:
  pull_request:
    paths:
      - "naseri_markets/mt5_demo_operator_smoke_v1.py"
      - "naseri_markets/mt5_demo_operator_smoke_cli.py"
      - "naseri_markets/mt5_demo_history_readonly_v1.py"
      - "tests/unit/test_mt5_demo_operator_smoke_v1.py"
      - "docs/MT5_DEMO_OPERATOR_READONLY_SMOKE_V1.md"
      - ".github/workflows/mt5-demo-operator-smoke-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mt5-demo-operator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned offline unit/quality dependencies (no MT5 SDK)
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Compile and strict Ruff new and edited code
        run: |
          python -m compileall -q \
            naseri_markets/mt5_demo_operator_smoke_v1.py \
            naseri_markets/mt5_demo_operator_smoke_cli.py \
            naseri_markets/mt5_demo_history_readonly_v1.py \
            tests/unit/test_mt5_demo_operator_smoke_v1.py
          python -m ruff check --select E4,F,I,B,UP \
            naseri_markets/mt5_demo_operator_smoke_v1.py \
            naseri_markets/mt5_demo_operator_smoke_cli.py \
            naseri_markets/mt5_demo_history_readonly_v1.py \
            tests/unit/test_mt5_demo_operator_smoke_v1.py
      - name: Stages 1 through 9 offline nonproduction acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}
          MMT_NONPRODUCTION: "1"
        run: |
          python -m pytest -q --confcutdir=tests/unit \
            tests/unit/test_mt5_demo_operator_smoke_v1.py \
            tests/unit/test_mt5_demo_independent_reverify_v1.py \
            tests/unit/test_mt5_demo_evidence_custody_v1.py \
            tests/unit/test_mt5_demo_history_readonly_v1.py \
            tests/unit/test_mt5_demo_readonly_v1.py \
            tests/unit/test_paper_position_reconciler_v1.py \
            tests/unit/test_execution_position_core_v1.py \
            tests/unit/test_risk_portfolio_manager_v1.py \
            tests/unit/test_execution_architecture_v1.py
      - name: No broker write, login, PAPER mutation or private data output
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = (
              Path("naseri_markets/mt5_demo_operator_smoke_v1.py"),
              Path("naseri_markets/mt5_demo_operator_smoke_cli.py"),
          )
          forbidden = {
              "order_send", "order_check", "login", "symbol_select",
              "create", "apply", "release", "reserve", "halt",
              "configure_account", "configure_portfolio", "commit",
              "connect", "write", "dump",
          }
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              calls = {
                  n.func.attr for n in ast.walk(tree)
                  if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute)
              }
              assert not calls.intersection(forbidden), (path, calls)
          assert not any(
              isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute)
              and n.func.attr == "initialize"
              for n in ast.walk(ast.parse(paths[0].read_text(encoding="utf-8")))
          )
          print("PASS: MT5 DEMO smoke has no trade, login or PAPER mutation routes")
          PY
