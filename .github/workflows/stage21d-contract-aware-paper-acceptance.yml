name: Stage 21D contract-aware PAPER economics acceptance

on:
  pull_request:
    paths:
      - 'naseri_markets/paper_contract_economics_stage21d_v1.py'
      - 'naseri_markets/paper_contract_audit_stage21d_v1.py'
      - 'naseri_markets/risk_portfolio_manager_v1.py'
      - 'naseri_markets/execution_position_core_v1.py'
      - 'naseri_markets/paper_core_risk_bridge_v1.py'
      - 'naseri_markets/paper_order_lifecycle_v1.py'
      - 'naseri_markets/captured_paper_pilot_stage21b_v1.py'
      - 'naseri_markets/public_forward_capture_stage21c_v1.py'
      - 'naseri_markets/public_forward_capture_cli_stage21c_v1.py'
      - 'tests/unit/test_paper_contract_economics_stage21d_v1.py'
      - 'tests/unit/test_public_forward_capture_stage21c_v1.py'
      - 'docs/CONTRACT_AWARE_PAPER_STAGE21D_V1.md'
      - '.github/workflows/stage21d-contract-aware-paper-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage21d-clean-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Public source and legacy release gates
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/paper_contract_economics_stage21d_v1.py \
            naseri_markets/paper_contract_audit_stage21d_v1.py \
            naseri_markets/risk_portfolio_manager_v1.py \
            naseri_markets/execution_position_core_v1.py \
            naseri_markets/paper_core_risk_bridge_v1.py \
            naseri_markets/paper_order_lifecycle_v1.py \
            naseri_markets/captured_paper_pilot_stage21b_v1.py \
            naseri_markets/public_forward_capture_stage21c_v1.py \
            naseri_markets/public_forward_capture_cli_stage21c_v1.py \
            tests/unit/test_paper_contract_economics_stage21d_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Full contract economics and relevant Stage21 regression
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage21d-tests"
          cp tests/unit/test_paper_contract_economics_stage21d_v1.py \
             tests/unit/test_public_forward_capture_stage21c_v1.py \
             tests/unit/test_captured_paper_pilot_stage21b_v1.py \
             tests/unit/test_captured_paper_cli_stage21b_v1.py \
             tests/unit/test_unified_paper_pilot_stage20_v1.py \
             tests/unit/test_stage19_integrated_effects_v1.py \
             "$RUNNER_TEMP/stage21d-tests/"
          python -m pytest -q "$RUNNER_TEMP/stage21d-tests" -rs
      - name: Isolated installed-wheel Stage21D contract tests
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage21d-project" "$RUNNER_TEMP/stage21d-wheel" \
             "$RUNNER_TEMP/stage21d-room" "$RUNNER_TEMP/stage21d-wheel-tests"
          cp platform_release/pyproject.toml platform_release/README.md \
             "$RUNNER_TEMP/stage21d-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage21d-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage21d-venv"
          "$RUNNER_TEMP/stage21d-venv/bin/python" -m pip wheel --no-deps \
             --wheel-dir "$RUNNER_TEMP/stage21d-wheel" "$RUNNER_TEMP/stage21d-project"
          "$RUNNER_TEMP/stage21d-venv/bin/python" -m pip install \
             "$RUNNER_TEMP"/stage21d-wheel/multi_market_trading-0.4.0rc1-*.whl \
             'pytest==9.1.1'
          "$RUNNER_TEMP/stage21d-venv/bin/python" -m pip check
          cp tests/unit/test_paper_contract_economics_stage21d_v1.py \
             tests/unit/test_public_forward_capture_stage21c_v1.py \
             "$RUNNER_TEMP/stage21d-wheel-tests/"
          cd "$RUNNER_TEMP/stage21d-room"
          PYTHONPATH= "$RUNNER_TEMP/stage21d-venv/bin/python" -m pytest -q \
             "$RUNNER_TEMP/stage21d-wheel-tests" -rs
