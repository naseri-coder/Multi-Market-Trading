name: Stage 22 durable third-party core isolation admission

on:
  pull_request:
    paths:
      - 'naseri_markets/durable_isolated_core_gate_stage22_v1.py'
      - 'tests/unit/test_durable_isolated_core_gate_stage22_v1.py'
      - 'docs/THIRD_PARTY_CORE_ISOLATION_STAGE22_V1.md'
      - '.github/workflows/stage22-durable-isolated-core-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage22-controlled-sandbox-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Static unsafe-source and legacy publication gates
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/durable_isolated_core_gate_stage22_v1.py \
            tests/unit/test_durable_isolated_core_gate_stage22_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Synthetic-only tenant gating, stage4 and stage7 plus history
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage22-tests"
          cp tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             tests/unit/test_strategy_orchestrator_v1.py \
             tests/unit/test_market_evidence_gate_stage21f_v1.py \
             tests/unit/test_public_funding_mark_stage21e_v1.py \
             tests/unit/test_public_forward_capture_stage21c_v1.py \
             tests/unit/test_paper_contract_economics_stage21d_v1.py \
             tests/unit/test_stage19_integrated_effects_v1.py \
             "$RUNNER_TEMP/stage22-tests/"
          python -m pytest -q "$RUNNER_TEMP/stage22-tests" -rs
      - name: Clean-wheel Stage22 ABI admission from outside repository
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage22-project" "$RUNNER_TEMP/stage22-wheel" \
             "$RUNNER_TEMP/stage22-room" "$RUNNER_TEMP/stage22-wheel-tests"
          cp platform_release/pyproject.toml platform_release/README.md \
             "$RUNNER_TEMP/stage22-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage22-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage22-venv"
          "$RUNNER_TEMP/stage22-venv/bin/python" -m pip wheel --no-deps \
             --wheel-dir "$RUNNER_TEMP/stage22-wheel" "$RUNNER_TEMP/stage22-project"
          "$RUNNER_TEMP/stage22-venv/bin/python" -m pip install \
             "$RUNNER_TEMP"/stage22-wheel/multi_market_trading-0.4.0rc1-*.whl \
             'pytest==9.1.1'
          "$RUNNER_TEMP/stage22-venv/bin/python" -m pip check
          cp tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage22-wheel-tests/"
          cd "$RUNNER_TEMP/stage22-room"
          PYTHONPATH= "$RUNNER_TEMP/stage22-venv/bin/python" -m pytest -q \
             "$RUNNER_TEMP/stage22-wheel-tests" -rs
