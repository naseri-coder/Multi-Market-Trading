name: MMT MT-A1 offline MQ4 MQ5 EX5 artifact review

on:
  pull_request:
    paths:
      - "naseri_markets/mt_a1_offline_artifact_preflight.py"
      - "tests/unit/test_mt_a1_offline_artifact_preflight.py"
      - "docs/MMT_MT_A1_OFFLINE_ARTIFACT_PREFLIGHT.md"
      - ".github/workflows/mt-a1-artifact-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-mt4-mt5-artifact-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONPATH: ${{ github.workspace }}/production_source:${{ github.workspace }}
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tests only - no broker SDK or MetaTrader terminal
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.16.9 \
            pydantic-settings==2.15.0
      - name: MQ4 MQ5 EX5 local bytes, MetaTrader DEMO and A6 regressions
        run: |
          set -Eeuo pipefail
          python -m ruff check \
            naseri_markets/mt_a1_offline_artifact_preflight.py \
            tests/unit/test_mt_a1_offline_artifact_preflight.py
          python -m pytest -q -ra \
            tests/unit/test_mt_a1_offline_artifact_preflight.py \
            tests/unit/test_mt5_demo_readonly_v1.py \
            tests/unit/test_data_runtime_paper_wire_a1.py \
            tests/unit/test_runtime_a6_dispatch_fence.py
