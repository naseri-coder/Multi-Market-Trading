name: MMT CERT-A5 fixed benign four-language replay (nonproduction)

on:
  pull_request:
    paths:
      - "tests/unit/test_cert_a5_real_benign_worker_replay.py"
      - "docs/MMT_CERT_A5_REAL_BENIGN_WORKER_REPLAY.md"
      - ".github/workflows/cert-a5-benign-worker-replay.yml"
      - "scripts/runtime_a2_worker.py"
      - "naseri_markets/multilang_runtime_a1.py"
      - "naseri_markets/historical_data_loader_a1.py"
      - "naseri_markets/runtime_a6_dispatch_fence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-fixtures-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: production_source:.
      MMT_NONPRODUCTION: "1"
      MMT_CERT_A5_FIXED_FIXTURES_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned test dependencies (reviewed literal fixtures only)
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            pyarrow==21.0.0 wasmtime==49.0.0 \
            pydantic-settings==2.15.0 ruff==0.16.9
          npm install --global --ignore-scripts typescript@5.9.3
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Real interpreter replay and A6 unconditional denial
        run: |
          set -Eeuo pipefail
          python -m ruff check \
            tests/unit/test_cert_a5_real_benign_worker_replay.py
          python -m pytest -q -ra \
            tests/unit/test_cert_a5_real_benign_worker_replay.py \
            tests/unit/test_runtime_a6_dispatch_fence.py \
            | tee "$RUNNER_TEMP/mmt-cert-a5.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/mmt-cert-a5.log"; then
            echo "CERT_A5_SKIPPED_SCENARIO_REFUSED" >&2
            exit 1
          fi

  # Deliberately no Docker or adversarial uploaded-code execution.
  # GitHub hosted runners DO NOT certify rootless+gVisor containment.
