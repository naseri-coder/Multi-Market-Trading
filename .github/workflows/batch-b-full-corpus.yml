name: Batch B Full Corpus

on:
  push:
    branches:
      - server-full-convergence-r3-b-chat-r1

permissions:
  contents: read

jobs:
  full-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PTB_TIMEDELTA: "1"
      TELEGRAM_RUNTIME_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      ADMIN_IDS: "123456789"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Materialize frozen release layout
        run: |
          set -Eeuo pipefail
          cp -a production_source/app ./app
          cp -a production_source/migrations ./migrations
          cp production_source/alembic.ini ./alembic.ini
          test -f migrations/versions/20260928_0021_ch6_ii_opportunity_identity.py

      - name: Start disposable PostgreSQL on private Unix socket only
        id: pg
        run: |
          set -Eeuo pipefail
          socket_dir="/tmp/ch6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="batchb-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$socket_dir"
          chmod 0777 "$socket_dir"
          docker run -d --rm             --name "$container"             -e POSTGRES_USER=batchb             -e POSTGRES_PASSWORD=batchb-synthetic-only             -e POSTGRES_DB=batchbtest             -v "$socket_dir:/var/run/postgresql"             postgres:16-alpine             -c listen_addresses=''             -c unix_socket_directories=/var/run/postgresql
          for i in $(seq 1 60); do
            if docker exec "$container" pg_isready -U batchb -d batchbtest >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" pg_isready -U batchb -d batchbtest
          docker exec "$container" createdb -U batchb ch6synthetic
          echo "socket_dir=$socket_dir" >> "$GITHUB_OUTPUT"
          echo "container=$container" >> "$GITHUB_OUTPUT"

      - name: Apply migrations to both disposable databases
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://batchb:batchb-synthetic-only@/batchbtest?host=${{ steps.pg.outputs.socket_dir }}
          CH6_DISPOSABLE_DATABASE_URL: postgresql+asyncpg://batchb:batchb-synthetic-only@/ch6synthetic?host=${{ steps.pg.outputs.socket_dir }}
        run: |
          set -Eeuo pipefail
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic -c alembic.ini upgrade head
          DATABASE_URL="$CH6_DISPOSABLE_DATABASE_URL" python -m alembic -c alembic.ini upgrade head

      - name: Run complete tracked test corpus
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://batchb:batchb-synthetic-only@/batchbtest?host=${{ steps.pg.outputs.socket_dir }}
          CH6_DISPOSABLE_DATABASE_URL: postgresql+asyncpg://batchb:batchb-synthetic-only@/ch6synthetic?host=${{ steps.pg.outputs.socket_dir }}
          CH6_ISOLATED_SOURCE: ${{ github.workspace }}
          RUN_PUBLIC_MARKET_DATA_SMOKE: "0"
        run: |
          set -Eeuo pipefail
          python -m pytest -q 2>&1 | tee /tmp/full-corpus.log
          if grep -Eq '(^| )([1-9][0-9]* )?skipped' /tmp/full-corpus.log; then
            skips="$(grep -Eo '[0-9]+ skipped' /tmp/full-corpus.log | tail -1 | cut -d' ' -f1 || true)"
            test "${skips:-0}" -le 2
          fi

      - name: Clean disposable PostgreSQL
        if: always()
        run: |
          set +e
          docker rm -f "${{ steps.pg.outputs.container }}" >/dev/null 2>&1
          rm -rf "${{ steps.pg.outputs.socket_dir }}"
