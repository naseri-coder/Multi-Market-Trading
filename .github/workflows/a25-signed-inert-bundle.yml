name: A25 Multi Market Trading inert Custom supply-chain admission

on:
  push:
    branches: [feature/a25-signed-inert-custom-bundle-admission]
  pull_request:
    paths:
      - "naseri_markets/a25_bundle_admission.py"
      - "tests/unit/test_a25_bundle_admission.py"
      - "docs/MULTI_MARKET_TRADING_A25_SUPPLY_CHAIN.md"
      - ".github/workflows/a25-signed-inert-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a25-offline-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Frozen historical tree and public source preflight
        run: |
          set -Eeuo pipefail
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
          test "$GITHUB_ACTIONS" = true
          test "$(id -u)" -ne 0
          test -f /sys/fs/cgroup/cgroup.controllers
          test -x /usr/bin/sudo
          test -x /usr/bin/systemd-run
          ldconfig -p | grep -F libseccomp.so.2
      - name: Signed A25 inert ZIP admission and A7-A24 affected regressions
        run: |
          set -Eeuo pipefail
          python -m pip install -e ".[dev]"
          python -m pip install "cryptography==46.0.3"
          python -m pytest -q \
            tests/unit/test_a25_bundle_admission.py \
            tests/unit/test_a24_publisher_admission.py \
            tests/unit/test_a23_sandbox_adapter.py \
            tests/unit/test_a22_custom_bridge.py \
            tests/unit/test_a21_custom_contract.py \
            tests/unit/test_a8_plugin_framework.py \
            tests/unit/test_a7_replay_pipeline.py \
            tests/unit/test_a20_integration.py \
            tests/unit/test_a19_hardening.py \
            tests/unit/test_a18_guardian.py \
            tests/unit/test_a17_watchdog.py \
            tests/unit/test_a16_supervisor.py \
            tests/unit/test_a15_releases.py \
            tests/unit/test_a14_packages.py \
            tests/unit/test_a13_provisioning.py \
            tests/unit/test_a12_trust.py
      - name: Static no-private-execution and strict lint
        run: |
          set -Eeuo pipefail
          python -m ruff check --select E4,F \
            naseri_markets/a25_bundle_admission.py \
            tests/unit/test_a25_bundle_admission.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("naseri_markets/a25_bundle_admission.py").read_text()
          tree = ast.parse(source)
          banned = {"subprocess", "socket", "importlib", "runpy", "requests",
                    "httpx", "aiohttp", "pickle", "ctypes"}
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  assert all(alias.name.split(".")[0] not in banned for alias in n.names)
              if isinstance(n, ast.ImportFrom):
                  assert (n.module or "").split(".")[0] not in banned
          for forbidden in ("Ed25519PrivateKey", "shell=True",
                            "extractall(", "extract(", "production_source",
                            "private_nyfr_core", "r0_engine"):
              assert forbidden not in source
          print("A25_SIGNED_INERT_ARCHIVE_NO_EXECUTION_PASS")
          PY
      - name: Public distribution excludes all private and encoded executable artifacts
        run: |
          set -Eeuo pipefail
          python -m pip install "setuptools==80.9.0" "wheel==0.45.1"
          python scripts/a6_prepare_package.py --destination "$RUNNER_TEMP/a25-public"
          test -f "$RUNNER_TEMP/a25-public/naseri_markets/a25_bundle_admission.py"
          test ! -e "$RUNNER_TEMP/a25-public/naseri_markets/private_nyfr_core.py"
          test ! -e "$RUNNER_TEMP/a25-public/naseri_markets/r0_engine.py"
          if find "$RUNNER_TEMP/a25-public" -type f \
             \( -name '*.enc' -o -name '*.age' -o -name '*.zip' \
                -o -name '*.so' -o -name '*.pyd' -o -name '*.bin' \) | grep -q .; then
            echo "A25_PROPRIETARY_ARTIFACT_BLOCKED"; exit 1
          fi
          echo "A25_PUBLIC_FIXED_METADATA_NO_NYFR_PASS"
