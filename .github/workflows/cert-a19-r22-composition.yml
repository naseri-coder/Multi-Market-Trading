name: CERT-A19-R22 pinned Wolfi loader byte parity and apko collision semantics audit

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r22-composition.yml"

permissions:
  contents: read
  actions: read

jobs:
  signed-static-composition-review:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cert-a19-byte-audit-run' && github.repository == 'naseri-coder/Multi-Market-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Rehydrate frozen R18 / R21 evidence with exact original hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r22"
          mkdir -m 0700 "$work"
          mkdir "$work/r18" "$work/r21" "$work/apks" "$work/source"
          gh run download 38642890495 --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r18-apko-signed-offline-closure-audit --dir "$work/r18"
          gh run download 38648206711 --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r21-signed-rootfs-loader-path-static --dir "$work/r21"
          cp "$work/r18/APKINDEX.tar.gz" "$work/APKINDEX.tar.gz"
          cp "$work/r18/r18-result.json" "$work/r18-result.json"
          cp "$work/r21/r21-static-rootfs-path.json" "$work/r21-static-rootfs-path.json"
          echo '8011fbdaf70278ae83e3729dc2c44a8148a91cf03ea0ef7a3d049e30a65e36a5  '"$work/APKINDEX.tar.gz" | sha256sum -c --status
          echo '78356a69bf4c7aa50856450b1b4f55f9aaaf4909072891909a9fe73697fd139b  '"$work/r18-result.json" | sha256sum -c --status
          echo '8ccc6f9a02a373d2262dad6e9ebd9d3bf07b523fa850bbb82e83e2d1591847e8  '"$work/r21-static-rootfs-path.json" | sha256sum -c --status
          echo R22_FROZEN_EVIDENCE_RESTORED
      - name: Verify original signed image and export stopped rootfs without running it
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r22"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$image" > "$work/cosign-base.log"
          echo SIGNED_PUBLISHER_VERIFIED > "$work/base-signature.status"
          printf '%s\n' "$image" > "$work/base.txt"
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create --pull=never --platform linux/amd64 --entrypoint=/bin/true "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          docker export "$cid" > "$work/base-created-export.tar"
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          test "$(stat -c%s "$work/base-created-export.tar")" -lt 220000000
          echo R22_SIGNED_BASE_EXPORTED_NOT_STARTED
      - name: Pin exact apko v1.4.11 Go source semantics by Git blob digest
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r22"
          commit='5b3c3182430465dd2212a656411267f150034255'
          for file in install.go implementation.go; do
            curl --proto '=https' --proto-redir '=https' --fail --location \
              --silent --show-error --connect-timeout 15 --max-time 80 \
              "https://raw.githubusercontent.com/chainguard-dev/apko/$commit/pkg/apk/apk/$file" \
              -o "$work/source/$file"
          done
          test "$(git hash-object "$work/source/install.go")" = '627e6aae37100935e7b298874e224e26d3311a1f'
          test "$(git hash-object "$work/source/implementation.go")" = '588398c9bf71aae2c43bfb167500d5746b87ea64'
          printf '%s\n' '627e6aae37100935e7b298874e224e26d3311a1f' > "$work/source/install.go.git-blob.sha"
          printf '%s\n' '588398c9bf71aae2c43bfb167500d5746b87ea64' > "$work/source/implementation.go.git-blob.sha"
          echo R22_APKO_V1_4_11_SOURCE_BLOBS_PINNED_NO_TOOL_EXECUTION
      - name: Fetch ONLY four R18 pinned archive files as bytes, not installable programs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          from urllib.parse import urlsplit
          work=pathlib.Path(os.environ["RUNNER_TEMP"])/"cert-a19-r22"
          report=json.loads((work/"r18-result.json").read_text())
          selection={"ld-linux-2.44","ncurses","libffi","wolfi-baselayout"}
          items=[p for p in report["archive_verification"] if p["package"] in selection]
          if len(items)!=4:raise ValueError("R22_MISSING_FROZEN_APK_SELECTION")
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  u=urlsplit(newurl)
                  if u.scheme!="https" or u.hostname not in {"apk.cgr.dev","9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com"}:
                      raise ValueError("R22_UNRECOGNIZED_APK_REDIRECT")
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          op=urllib.request.build_opener(Redirect())
          for p in items:
              name=p["package"]+"-"+p["version"]+".apk"
              url="https://apk.cgr.dev/chainguard/x86_64/"+name
              with op.open(url,timeout=45) as response:
                  data=response.read(100_000_001)
              if len(data)!=p["whole_apk_bytes"] or hashlib.sha256(data).hexdigest()!=p["whole_apk_sha256"]:
                  raise ValueError("R22_APK_HASH_NOT_FROZEN")
              (work/"apks"/name).write_bytes(data)
              print("R22_FROZEN_APK_BYTES="+name)
          PY
      - name: Compare loader file bytes and provenance-aware two composition collisions STATIC ONLY
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.ci_cert_a19_r22_loader_composition
          test -s "$RUNNER_TEMP/cert-a19-r22/r22-loader-and-conflicts.json"
          sha256sum "$RUNNER_TEMP/cert-a19-r22/r22-loader-and-conflicts.json"
      - name: Retain immutable decision JSON only, no executables, .apk, OCI tar or tool blobs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r22-loader-byte-parity-and-collision-review
          path: ${{ runner.temp }}/cert-a19-r22/r22-loader-and-conflicts.json
          if-no-files-found: ignore
          retention-days: 2
