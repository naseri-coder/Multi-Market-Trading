name: Temporary NumPy hash-lock generation
on:
  push:
    branches:
      - numpy-2.5.3-coordinated
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate candidate hash lock
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          python3 -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --disable-pip-version-check "pip-tools==7.6.1"
          CUSTOM_COMPILE_COMMAND="scripts/verify_hashed_lock.sh --check" \
            "$work/venv/bin/pip-compile" \
            --generate-hashes \
            --resolver=backtracking \
            --output-file requirements.hashed.generated.lock \
            requirements.lock
          "$work/venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --dry-run \
            --requirement requirements.hashed.generated.lock
      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: numpy-2.5.3-hash-lock
          path: requirements.hashed.generated.lock
          if-no-files-found: error
          retention-days: 1
