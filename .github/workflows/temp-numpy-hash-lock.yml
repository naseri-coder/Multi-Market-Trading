name: Temporary NumPy hash-lock generation
on:
  push:
    branches:
      - numpy-2.5.3-coordinated
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate coordinated hashed lock
        run: bash scripts/verify_hashed_lock.sh --check --output requirements.hashed.generated.lock
      - name: Upload generated lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: numpy-2.5.3-hash-lock
          path: requirements.hashed.generated.lock
          if-no-files-found: warn
          retention-days: 1
