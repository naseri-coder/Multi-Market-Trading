name: Stage 25 third-party preinstall signed evidence readiness

on:
  pull_request:
    paths:
      - 'naseri_markets/preinstall_evidence_stage25_v1.py'
      - 'tests/unit/test_preinstall_evidence_stage25_v1.py'
      - 'docs/THIRD_PARTY_CORE_PREINSTALL_GATE_STAGE25_V1.md'
      - '.github/workflows/stage25-third-party-preinstall-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage25-offline-signed-preinstall:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: No-trade source, signature and legacy publication gate
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9' 'cryptography==46.0.3'
          python -m ruff check --select E4,F \
            naseri_markets/preinstall_evidence_stage25_v1.py \
            tests/unit/test_preinstall_evidence_stage25_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Four-stage independent tenant/provenance review
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage25-tests"
          cp tests/unit/test_preinstall_evidence_stage25_v1.py \
             tests/unit/test_host_observation_custody_stage24_v1.py \
             tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage25-tests/"
          python -m pytest -q "$RUNNER_TEMP/stage25-tests" -rs
      - name: Clean installed wheel immutable signed-source checks
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage25-project" "$RUNNER_TEMP/stage25-wheel" \
             "$RUNNER_TEMP/stage25-room" "$RUNNER_TEMP/stage25-tests-installed"
          cp platform_release/pyproject.toml platform_release/README.md \
             "$RUNNER_TEMP/stage25-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage25-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage25-venv"
          "$RUNNER_TEMP/stage25-venv/bin/python" -m pip wheel --no-deps \
             --wheel-dir "$RUNNER_TEMP/stage25-wheel" "$RUNNER_TEMP/stage25-project"
          "$RUNNER_TEMP/stage25-venv/bin/python" -m pip install \
             "$RUNNER_TEMP"/stage25-wheel/multi_market_trading-0.4.0rc1-*.whl \
             'pytest==9.1.1' 'cryptography==46.0.3'
          "$RUNNER_TEMP/stage25-venv/bin/python" -m pip check
          cp tests/unit/test_preinstall_evidence_stage25_v1.py \
             tests/unit/test_host_observation_custody_stage24_v1.py \
             tests/unit/test_signed_core_candidate_stage23_v1.py \
             tests/unit/test_disposable_gvisor_canary_stage23_v1.py \
             tests/unit/test_durable_isolated_core_gate_stage22_v1.py \
             tests/unit/test_secure_plugin_runtime_v1.py \
             "$RUNNER_TEMP/stage25-tests-installed/"
          cd "$RUNNER_TEMP/stage25-room"
          PYTHONPATH= "$RUNNER_TEMP/stage25-venv/bin/python" -m pytest -q \
             "$RUNNER_TEMP/stage25-tests-installed" -rs
