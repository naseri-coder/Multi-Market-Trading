name: MMT CERT-A14 offline Critical/High evidence triage (MOCK ONLY)

on:
  pull_request:
    paths:
      - ".github/workflows/cert-a14-offline-triage.yml"
      - "scripts/ci_cert_a14_grype_triage.py"
      - "tests/unit/test_cert_a14_grype_triage.py"
      - "docs/MMT_CERT_A14_CRITICAL_HIGH_TRIAGE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only-parser-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MMT_NONPRODUCTION: "1"
      PYTHONPATH: production_source:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate triage parser, source authority denial and no skips
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            pydantic-settings==2.15.0 ruff==0.16.9
          python -m ruff check \
            scripts/ci_cert_a14_grype_triage.py \
            tests/unit/test_cert_a14_grype_triage.py
          python -m pytest -q -ra \
            tests/unit/test_cert_a14_grype_triage.py \
            tests/unit/test_runtime_a6_dispatch_fence.py \
            | tee "$RUNNER_TEMP/cert-a14-review.txt"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/cert-a14-review.txt"; then
            echo "CERT_A14_UNEXECUTED_SECURITY_CHECK_REFUSED" >&2
            exit 1
          fi
          echo "CERT_A14_MOCK_ONLY__NO_REAL_CVE_DISPOSITION_OR_A6_UNLOCK"
