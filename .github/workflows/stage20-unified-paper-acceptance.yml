name: Stage 20 installed multi-binding PAPER acceptance

on:
  pull_request:
    paths:
      - 'naseri_markets/unified_paper_pilot_stage20_v1.py'
      - 'tests/unit/test_unified_paper_pilot_stage20_v1.py'
      - 'docs/UNIFIED_PAPER_PILOT_STAGE20_V1.md'
      - '.github/workflows/stage20-unified-paper-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage20-clean-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Static safety and publication checks
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/unified_paper_pilot_stage20_v1.py \
            tests/unit/test_unified_paper_pilot_stage20_v1.py
          python scripts/a6_release_preflight.py
          python scripts/check_publication_safety.py
      - name: Real Stage 8/9/12/16/17/19 local ledger integration
        env:
          MMT_NONPRODUCTION: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/unit/test_unified_paper_pilot_stage20_v1.py
      - name: Install new-product wheel in clean room
        env:
          MMT_NONPRODUCTION: '1'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/stage20-project" "$RUNNER_TEMP/stage20-wheel" \
                   "$RUNNER_TEMP/stage20-room" "$RUNNER_TEMP/stage20-tests"
          cp platform_release/pyproject.toml platform_release/README.md "$RUNNER_TEMP/stage20-project/"
          cp -a naseri_markets "$RUNNER_TEMP/stage20-project/naseri_markets"
          python -m venv "$RUNNER_TEMP/stage20-venv"
          "$RUNNER_TEMP/stage20-venv/bin/python" -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/stage20-wheel" "$RUNNER_TEMP/stage20-project"
          "$RUNNER_TEMP/stage20-venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/stage20-wheel/multi_market_trading-0.4.0rc1-*.whl \
            'pytest==9.1.1'
          "$RUNNER_TEMP/stage20-venv/bin/python" -m pip check
          cp tests/unit/test_unified_paper_pilot_stage20_v1.py "$RUNNER_TEMP/stage20-tests/"
          cd "$RUNNER_TEMP/stage20-room"
          PYTHONPATH= "$RUNNER_TEMP/stage20-venv/bin/python" -m pytest -q \
            "$RUNNER_TEMP/stage20-tests" -rs
