name: Batch B Ruff Autofix

on:
  push:
    branches:
      - server-full-convergence-r3-b-chat-r1

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message != 'ci: ruff autofix batch b'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.9"

      - name: Format changed Python files only
        env:
          BASE_SHA: 409fe40636929e80325bbec1bc760da2ecd7835c
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- '*.py')
          printf 'BATCH_B_PY_FILES=%s\n' "${#files[@]}"
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            test -f "$file"
            python -m ruff check --fix "$file" || true
            python -m ruff format "$file"
          done

      - name: Commit formatter output
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "RUFF_AUTOFIX_NO_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git diff --cached --check
          git commit -m "ci: ruff autofix batch b"
          git push origin HEAD:server-full-convergence-r3-b-chat-r1
