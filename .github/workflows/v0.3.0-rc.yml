name: v0.3.1 Release Candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v031-rc-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package-config:
    name: Package and configuration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reproducible development lock
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Verify frozen source and release metadata
        run: bash scripts/verify.sh
      - name: Validate synthetic safe-install configuration
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          source = Path(".env.example").read_text(encoding="utf-8")
          source = source.replace("REPLACE_WITH_NUMERIC_ADMIN_ID", "123456789")
          source = source.replace(
              "REPLACE_WITH_NEW_RANDOM_URLSAFE_PASSWORD",
              "Synthetic_Release_Candidate_Password_2026",
          )
          path = Path("/tmp/v031-rc.env")
          path.write_text(source, encoding="utf-8")
          os.chmod(path, 0o600)
          PY
          python scripts/check_env.py /tmp/v031-rc.env
          PYTHONPATH=production_source python scripts/validate_release_config.py             --env-file /tmp/v031-rc.env --mode safe-install
      - name: Build wheel and source distribution
        run: |
          set -Eeuo pipefail
          rm -rf dist
          python -m build --sdist --wheel
          test "$(find dist -maxdepth 1 -name 'crypto_price_action-0.3.1-*.whl' | wc -l)" -eq 1
          test -f dist/crypto_price_action-0.3.1.tar.gz
      - name: Prove clean wheel import outside checkout
        run: |
          set -Eeuo pipefail
          python -m venv /tmp/v031-wheel
          /tmp/v031-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          cd /tmp
          /tmp/v031-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import app

          resolved = Path(app.__file__).resolve()
          assert "site-packages" in resolved.parts, resolved
          assert version("crypto-price-action") == "0.3.1"
          print("CLEAN_WHEEL_IMPORT_PASS", resolved)
          PY

  stage3b:
    name: Fresh-host Docker and offline startup rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TEST_PROJECT: stage3b-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Frozen-release preflight
        run: |
          set -Eeuo pipefail
          test ! -e .env
          bash scripts/install.sh --check
          grep -Fq 'revision = "20260928_0021"'             production_source/migrations/versions/20260928_0021_ch6_ii_opportunity_identity.py
          docker compose version
      - name: Synthetic environment acceptance and rejection cases
        run: python3 scripts/ci_stage3b_env.py
      - name: Compose isolation preflight
        run: python3 scripts/ci_stage3b_compose.py
      - name: Build, migrate, validate and exercise offline startup
        run: bash scripts/ci_stage3b.sh
      - name: Cleanup owned disposable resources
        if: always()
        run: bash scripts/ci_stage3b_cleanup.sh

  migration-0020-to-0021:
    name: 0020 to 0021 data-preservation rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      APP_ENV: "test"
      TELEGRAM_RUNTIME_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      ADMIN_IDS: "123456789"
      BROOKS_RUNTIME_ENABLED: "false"
      BROOKS_OPERATIONS_ENABLED: "false"
      PAPER_RUNTIME_ENABLED: "false"
      PERFORMANCE_REPORTS_ENABLED: "false"
      DB_ECHO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and materialize release layout
        run: |
          set -Eeuo pipefail
          python -m pip install -e ".[dev]"
          cp -a production_source/app ./app
          cp -a production_source/migrations ./migrations
          cp production_source/alembic.ini ./alembic.ini
      - name: Start socket-only disposable PostgreSQL
        id: pg
        run: |
          set -Eeuo pipefail
          root="/tmp/ch6-v031-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          socket_dir="${root}/socket"
          container="v031-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$socket_dir"
          chmod 0777 "$socket_dir"
          docker run -d --rm             --name "$container"             --security-opt no-new-privileges:true             -e POSTGRES_USER=rcsynthetic             -e POSTGRES_PASSWORD=rcsynthetic_password_2026             -e POSTGRES_DB=rcmigration             -v "$socket_dir:/var/run/postgresql"             postgres:16-alpine             -c listen_addresses=''             -c unix_socket_directories=/var/run/postgresql
          consecutive=0
          for _ in {1..90}; do
            if docker exec "$container" pg_isready -h /var/run/postgresql               -U rcsynthetic -d rcmigration >/dev/null 2>&1; then
              consecutive=$((consecutive + 1))
              [[ "$consecutive" -ge 3 ]] && break
            else
              consecutive=0
            fi
            sleep 1
          done
          test "$consecutive" -ge 3
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "socket_dir=$socket_dir" >> "$GITHUB_OUTPUT"
          echo "container=$container" >> "$GITHUB_OUTPUT"
      - name: Upgrade 0020 fixture to 0021 and preserve affected-row data
        env:
          DATABASE_URL: postgresql+asyncpg://rcsynthetic:rcsynthetic_password_2026@localhost/rcmigration?host=${{ steps.pg.outputs.socket_dir }}
        run: |
          set -Eeuo pipefail
          python -m alembic --raiseerr -c alembic.ini upgrade 20260914_0020
          docker exec -i "${{ steps.pg.outputs.container }}" psql             -h /var/run/postgresql -U rcsynthetic -d rcmigration -v ON_ERROR_STOP=1 <<'SQL'
          WITH inserted AS (
            INSERT INTO signals (
              symbol, direction, entry_price, stop_loss, leverage, status, publication_scope
            ) VALUES (
              'RCMIGRATION', 'LONG', 100, 90, 1, 'OPEN', 'INTERNAL'
            ) RETURNING id
          )
          INSERT INTO signal_automation_metadata (
            signal_id, producer, generation_mode, exchange, market_type, timeframe,
            setup_type, source_signal_id, idempotency_key, market_snapshot_id,
            market_snapshot_hash, engine_version, rule_set_version, configuration_version
          )
          SELECT
            id, 'BROOKS', 'SHADOW', 'synthetic', 'futures', '15m',
            'RC_0020_FIXTURE', 'rc-0020-source', 'rc-0020-idempotency',
            'rc-0020-snapshot', 'rc-0020-hash', 'rc-engine', 'rc-rules', 'rc-config'
          FROM inserted;
          SQL
          test "$(docker exec "${{ steps.pg.outputs.container }}" psql             -h /var/run/postgresql -U rcsynthetic -d rcmigration -Aqt             -c "SELECT count(*) FROM signal_automation_metadata WHERE source_signal_id='rc-0020-source';")" = "1"

          python -m alembic --raiseerr -c alembic.ini upgrade 20260928_0021

          test "$(docker exec "${{ steps.pg.outputs.container }}" psql             -h /var/run/postgresql -U rcsynthetic -d rcmigration -Aqt             -c "SELECT version_num FROM alembic_version;")" = "20260928_0021"
          test "$(docker exec "${{ steps.pg.outputs.container }}" psql             -h /var/run/postgresql -U rcsynthetic -d rcmigration -Aqt             -c "SELECT count(*) FROM signal_automation_metadata WHERE source_signal_id='rc-0020-source' AND opportunity_variant IS NULL AND opportunity_key IS NULL;")" = "1"
          docker exec "${{ steps.pg.outputs.container }}" psql             -h /var/run/postgresql -U rcsynthetic -d rcmigration -v ON_ERROR_STOP=1             -c "UPDATE signal_automation_metadata SET opportunity_variant='CH6_II_PAIR_STOP_V1', opportunity_key='rc-0020-pair' WHERE source_signal_id='rc-0020-source';"
          indexdef="$(docker exec "${{ steps.pg.outputs.container }}" psql             -h /var/run/postgresql -U rcsynthetic -d rcmigration -Aqt             -c "SELECT indexdef FROM pg_indexes WHERE indexname='uq_signal_automation_metadata_ii_opportunity';")"
          grep -Fq 'CREATE UNIQUE INDEX' <<<"$indexdef"
          grep -Fq 'opportunity_variant' <<<"$indexdef"
          grep -Fq 'CH6_II_PAIR_STOP_V1' <<<"$indexdef"
          grep -Fq 'opportunity_key' <<<"$indexdef"
          echo "MIGRATION_0020_TO_0021_DATA_PRESERVATION_PASS"
      - name: Cleanup migration rehearsal
        if: always()
        run: |
          set +e
          docker rm -f "${{ steps.pg.outputs.container }}" >/dev/null 2>&1
          sudo rm -rf "${{ steps.pg.outputs.root }}"
