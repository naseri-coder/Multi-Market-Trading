name: v0.3.0 Release Candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v030-rc-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release source and metadata
        run: bash scripts/verify.sh

      - name: Install reproducible RC development environment
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Verify exact version identity
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert project["project"]["version"] == "0.3.0"

          tree = ast.parse(Path("production_source/app/__init__.py").read_text(encoding="utf-8"))
          version = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          version = ast.literal_eval(node.value)
          assert version == "0.3.0"
          assert "version-v0.3.0" in Path("README.md").read_text(encoding="utf-8")
          assert "## v0.3.0 — 2026-10-03" in Path("CHANGELOG.md").read_text(encoding="utf-8")
          print("RELEASE_VERSION_IDENTITY_PASS")
          PY

      - name: Validate safe release configuration template
        run: python scripts/validate_release_config.py --env-file .env.example --mode template

      - name: Build source and wheel artifacts
        run: |
          set -Eeuo pipefail
          rm -rf dist build
          python -m build --sdist --wheel
          test "$(find dist -maxdepth 1 -type f -name 'crypto_price_action-0.3.0*' | wc -l)" -eq 2

      - name: Verify built wheel import and version
        run: |
          set -Eeuo pipefail
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python - <<'PY'
          import app
          assert app.__version__ == "0.3.0"
          print("RELEASE_WHEEL_IMPORT_PASS")
          PY

      - name: Verify dependency hash lock remains reproducible
        run: bash scripts/verify_hashed_lock.sh --check --output requirements.hashed.generated.lock
