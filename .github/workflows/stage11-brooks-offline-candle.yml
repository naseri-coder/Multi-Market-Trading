name: Stage 11 Brooks offline causal OHLC lifecycle and net-R

on:
  pull_request:
    paths:
      - "naseri_markets/brooks_stage11_candle_replay.py"
      - "naseri_markets/brooks_stage11_cli.py"
      - "naseri_markets/integrated_engine_panel.py"
      - "tests/unit/test_brooks_stage11_candle_replay.py"
      - "docs/STAGE11_BROOKS_OFFLINE_CANDLE_LIFECYCLE_V1.md"
      - ".github/workflows/stage11-brooks-offline-candle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage11-brooks-causal-candle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated development dependencies (no broker SDK)
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen Brooks source, compile, strict Python style
        run: |
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
          python -m compileall -q \
            naseri_markets/brooks_stage11_candle_replay.py \
            naseri_markets/brooks_stage11_cli.py \
            naseri_markets/integrated_engine_panel.py \
            tests/unit/test_brooks_stage11_candle_replay.py
          python -m ruff check --select E4,F \
            naseri_markets/brooks_stage11_candle_replay.py \
            naseri_markets/brooks_stage11_cli.py \
            naseri_markets/integrated_engine_panel.py \
            tests/unit/test_brooks_stage11_candle_replay.py
      - name: Stage1-11 offline lifecycle, crash and admin regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
          MMT_NONPRODUCTION: "1"
        run: |
          python -m pytest -q --confcutdir=tests/unit \
            tests/unit/test_brooks_stage11_candle_replay.py \
            tests/unit/test_brooks_stage10_paper_bridge.py \
            tests/unit/test_stage10_telegram_paper_view.py \
            tests/unit/test_execution_position_core_v1.py \
            tests/unit/test_risk_portfolio_manager_v1.py \
            tests/unit/test_paper_position_reconciler_v1.py \
            tests/unit/test_brooks_paper_receipts.py \
            tests/unit/test_brooks_real_offline_replay.py \
            tests/unit/test_integrated_engine_panel.py \
            tests/unit/test_brooks_paper_service.py \
            tests/unit/test_public_brooks_publication_controls.py
      - name: No broker, market network, channel sends or production routes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths=(
              Path("naseri_markets/brooks_stage11_candle_replay.py"),
              Path("naseri_markets/brooks_stage11_cli.py"),
          )
          forbidden={
              "order_send", "order_check", "login", "send_message",
              "publish", "poll_once", "replay_once", "initialize",
              "run_polling", "configure_account", "configure_portfolio",
              "register_instrument", "apply_live", "fetch", "post",
          }
          forbidden_imports={"MetaTrader5", "telegram", "httpx", "requests"}
          for path in paths:
              tree=ast.parse(path.read_text(encoding="utf-8"))
              calls={
                  n.func.attr for n in ast.walk(tree)
                  if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)
              }
              assert not forbidden.intersection(calls),(path,calls)
              for n in ast.walk(tree):
                  if isinstance(n,ast.Import):
                      assert not forbidden_imports.intersection(
                          {a.name for a in n.names}
                      ),path
              print("PASS: local Stage11 no feed/broker/Telegram dispatch",path)
          PY
      - name: Clean-wheel read-only Stage11 operator status
        run: |
          python scripts/a6_prepare_package.py --destination "$RUNNER_TEMP/stage11-wheel"
          python -m venv "$RUNNER_TEMP/stage11-clean"
          "$RUNNER_TEMP/stage11-clean/bin/python" -m pip install \
            "$RUNNER_TEMP/stage11-wheel[telegram-admin]" >/dev/null
          "$RUNNER_TEMP/stage11-clean/bin/python" - <<'PY'
          from naseri_markets.brooks_stage11_candle_replay import (
              BrooksStage11CandleReplay, stage11_panel_summary,
          )
          from naseri_markets.brooks_stage11_cli import main
          assert callable(BrooksStage11CandleReplay)
          assert callable(stage11_panel_summary) and callable(main)
          print("PASS: Stage11 installed in separately built public wheel")
          PY
          mkdir -m 700 "$RUNNER_TEMP/stage11-empty"
          "$RUNNER_TEMP/stage11-clean/bin/python" -m naseri_markets.brooks_stage11_cli \
            --status --state-dir "$RUNNER_TEMP/stage11-empty" \
            > "$RUNNER_TEMP/stage11-status.json"
          "$RUNNER_TEMP/stage11-clean/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          data=json.loads((root/"stage11-status.json").read_text())
          assert data["status"]=="NOT_CONFIGURED"
          assert data["closed_paper_trades"]==0
          assert data["broker_execution"] is False
          assert list((root/"stage11-empty").iterdir()) == []
          print("PASS: clean-wheel status is read-only and no fake trade created")
          PY
