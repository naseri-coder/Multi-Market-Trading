name: CERT-A19-R31 official gVisor GitHub-to-vendor-signed-APT inert byte parity

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r31-gvisor-cross-channel.yml"

permissions:
  contents: read
  actions: read

jobs:
  frozen-cross-channel-binary-custody:
    if: github.repository == 'naseri-coder/Multi-Market-Trading' && github.ref == 'refs/heads/cert-a19-byte-audit-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact R29 and R30 original reports and reject digests that drift
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r31"
          mkdir -m 0700 "$d"
          mkdir "$d/r29" "$d/r30"
          gh run download 38700270209 \
            --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r29-offline-gvisor-host-policy --dir "$d/r29"
          gh run download 38703730127 \
            --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r30-gvisor-signed-apt-native-custody --dir "$d/r30"
          cp "$d/r29/r29-policy-report.json" "$d/r29-policy-report.json"
          cp "$d/r30/r30-apt-custody.json" "$d/r30-apt-custody.json"
          echo '16400ae6890cbc5aae0a26df3179ab91db049b2d8fbce60c8e45646af2b0b160  '"$d/r29-policy-report.json" | sha256sum -c --status
          echo 'baefb28f1ee94932362078246cf6e6c8b4845b0c920938764d8e7926adc764da  '"$d/r30-apt-custody.json" | sha256sum -c --status
          echo R31_R29_R30_ORIGINAL_EVIDENCE_PINNED
      - name: Fetch exact OFFICIAL historical release-only tarball and checksum text, not executable install
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r31"
          gh release download release-20261005.0 \
            --repo google/gvisor --pattern 'SHA256SUMS' \
            --pattern 'gvisor-x86_64.tar.zstd' --dir "$d" --clobber
          echo 'dc3ea2d7486b9c07d9ad0ae3880b69a1a020708b83c4a8fe3bb781a871ef2308  '"$d/SHA256SUMS" | sha256sum -c --status
          echo '0a8a9058b9f11791a2097f03190c2ddc5b963c3dbee5bb9fd8497f4801c42f92  '"$d/gvisor-x86_64.tar.zstd" | sha256sum -c --status
          command -v zstd
          echo R31_EXACT_RELEASE_TARBALL_FULL_SHA256_MATCH
      - name: Stream-parse inert archive members; compare seven APT binary SHA256 and sizes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -u -m scripts.ci_cert_a19_r31_cross_channel_binary_parity
          test -s "$RUNNER_TEMP/cert-a19-r31/r31-two-channel-byte-parity.json"
          sha256sum "$RUNNER_TEMP/cert-a19-r31/r31-two-channel-byte-parity.json"
      - name: Preserve small JSON audit only, no keys, ELF binaries or full release archive
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r31-gvisor-release-vs-signed-apt-binary-parity
          path: ${{ runner.temp }}/cert-a19-r31/r31-two-channel-byte-parity.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Remove downloaded release and provenance payloads from disposable runner
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r31"
          test "$d" = "$RUNNER_TEMP/cert-a19-r31"
          rm -f -- "$d/gvisor-x86_64.tar.zstd" "$d/SHA256SUMS" "$d/r29-policy-report.json" "$d/r30-apt-custody.json"
          echo R31_DISPOSABLE_ORIGINAL_SOFTWARE_BYTES_PURGED
