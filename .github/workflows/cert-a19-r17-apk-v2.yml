name: CERT-A19-R17 independently verify APK v2 signed control and data (research)

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r17-apk-v2.yml"

permissions:
  contents: read

jobs:
  scoped-apk-v2-integrity:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cert-a19-byte-audit-run' && github.repository == 'naseri-coder/Multi-Market-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MMT_NONPRODUCTION: "1"
      MMT_R17_APKV2_TWO_OR_THREE_STREAM_STRICT_Q1: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate pinned Wolfi publisher and exact base key custody
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/cert-a19-r17"
          mkdir -m 0700 "$root"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$image" > "$root/sigstore-proof.json"
          echo PUBLISHER_IDENTITY_VERIFIED > "$root/signed-base.status"
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create --pull=never --platform linux/amd64 --entrypoint=/bin/true "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          docker cp "$cid:/etc/apk/keys" "$root/base-keys"
          docker cp "$cid:/etc/apk/repositories" "$root/base-repos"
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          grep -Fx 'https://apk.cgr.dev/chainguard' "$root/base-repos"
          echo R17_BASE_ONLY_STOPPED_NO_WORKER
      - name: Download ONE new index snapshot and validate native signature with signed Wolfi keyring
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/cert-a19-r17"
          mkdir -p "$root/localrepo/x86_64"
          curl --proto '=https' --proto-redir '=https' --fail --location \
            --silent --show-error --retry 1 --connect-timeout 15 --max-time 90 \
            'https://apk.cgr.dev/chainguard/x86_64/APKINDEX.tar.gz' \
            -o "$root/APKINDEX.tar.gz"
          test "$(stat -c%s "$root/APKINDEX.tar.gz")" -gt 1000000
          test "$(stat -c%s "$root/APKINDEX.tar.gz")" -lt 35000000
          cp "$root/APKINDEX.tar.gz" "$root/localrepo/x86_64/APKINDEX.tar.gz"
          printf 'file:///mnt/apkrepo\n' > "$root/repos"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          if ! docker run --rm --pull=never --platform linux/amd64 \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65534:65534 \
            --pids-limit=35 --memory=200m \
            --mount type=bind,src="$root/localrepo",dst=/mnt/apkrepo,readonly \
            --mount type=bind,src="$root/repos",dst=/mnt/repos,readonly \
            --entrypoint /sbin/apk "$image" \
            --no-cache --no-progress --keys-dir /etc/apk/keys \
            --repositories-file /mnt/repos search -x busybox \
            > "$root/index-native.log" 2> "$root/index-native.err"; then
            cat "$root/index-native.err"; exit 1
          fi
          grep -E '^busybox-[0-9]' "$root/index-native.log" | head -n 1
          if grep -Eiq 'untrusted|bad signature|error:|warning:' "$root/index-native.err"; then exit 1; fi
          echo SIGNED_APKINDEX_ACCEPTED > "$root/signed-index.status"
          echo R17_NATIVE_SIGNED_INDEX_ACCEPTED
      - name: Record actual APK version and avoid unsupported query commands
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/cert-a19-r17"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          docker run --rm --pull=never --platform linux/amd64 \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65534:65534 \
            --pids-limit=20 --memory=100m \
            --entrypoint /sbin/apk "$image" --version > "$root/apk-version.txt"
          echo 'NATIVE_APK_2_14_HAS_NO_QUERY_APPLET_CLOSURE_NOT_RESOLVED' > "$root/native-query.state"
          cat "$root/apk-version.txt"
      - name: Download exact four signed-index direct root archives, without installing
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, io, os, tarfile, urllib.request, urllib.parse
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"cert-a19-r17"
          selected={
            "glibc-2.44":"2.44-r8",
            "python-3.12":"3.12.15-r3",
            "python-3.12-base":"3.12.15-r3",
            "nodejs-24":"24.22.0-r0",
          }
          archive=root/"apks"
          archive.mkdir(mode=0o755)
          for name,ver in sorted(selected.items()):
            filename=f"{name}-{ver}.apk"
            url="https://apk.cgr.dev/chainguard/x86_64/"+filename
            request=urllib.request.Request(url,headers={"User-Agent":"MMT-A19-R17-custody-only"})
            with urllib.request.urlopen(request,timeout=45) as response:
              host=(urllib.parse.urlsplit(response.url).hostname or "").lower()
              if host!="apk.cgr.dev" and not host.endswith(".r2.cloudflarestorage.com"):
                raise ValueError("R17_UNTRUSTED_PACKAGE_REDIRECT")
              blob=response.read(90_000_001)
            if not 100<len(blob)<90_000_000:
              raise ValueError("R17_PACKAGE_SIZE_OUT_OF_BOUNDS")
            (archive/filename).write_bytes(blob)
            print("R17_ARCHIVE_FETCHED_"+filename+"_"+hashlib.sha256(blob).hexdigest())
          PY
      - name: Verify APK v2 compressed control against signed-index Q1 plus RSA signature and datahash
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.ci_cert_a19_r17_apk_v2
          test -s "$RUNNER_TEMP/cert-a19-r17/r17-result.json"
      - name: Archive immutable signed index BYTES and bounded audit evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r17-apkv2-control-signature-integrity
          path: |
            ${{ runner.temp }}/cert-a19-r17/APKINDEX.tar.gz
            ${{ runner.temp }}/cert-a19-r17/r17-result.json
            ${{ runner.temp }}/cert-a19-r17/apk-version.txt
            ${{ runner.temp }}/cert-a19-r17/native-query.state
          if-no-files-found: ignore
          retention-days: 2
