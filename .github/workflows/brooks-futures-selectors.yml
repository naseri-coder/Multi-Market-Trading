name: Brooks futures venue selection and eight timeframes (nonproduction)
on:
  pull_request:
    paths:
      - "naseri_markets/futures_venues.py"
      - "naseri_markets/engine_control_store.py"
      - "naseri_markets/integrated_engine_panel.py"
      - "naseri_markets/brooks_paper_service.py"
      - "naseri_markets/brooks_kraken_feed.py"
      - "naseri_markets/brooks_market_feed.py"
      - "naseri_markets/brooks_replay.py"
      - "tests/unit/test_brooks_futures_exchanges.py"
      - "tests/unit/test_brooks_pair_selection.py"
      - "naseri_markets/futures_pairs.py"
      - "tests/unit/test_brooks_exchange_admin_panel.py"
      - ".github/workflows/brooks-futures-selectors.yml"
      - "docs/BROOKS_FUTURES_EXCHANGE_TIMEFRAMES.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-futures-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Unmodified historical source and isolated release preflight
        run: |
          set -Eeuo pipefail
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
      - name: Lint new public catalog, UI and unit tests
        run: |
          set -Eeuo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check --select E4,F \
            naseri_markets/futures_venues.py \
            naseri_markets/engine_control_store.py \
            naseri_markets/integrated_engine_panel.py \
            naseri_markets/brooks_paper_service.py \
            tests/unit/test_brooks_futures_exchanges.py
            tests/unit/test_brooks_pair_selection.py \
            tests/unit/test_brooks_exchange_admin_panel.py
      - name: Actual frozen Brooks V5 on selected periods and cross-exchange fences
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/unit/test_brooks_futures_exchanges.py \
            tests/unit/test_brooks_exchange_admin_panel.py \
            tests/unit/test_brooks_kraken_feed.py \
            tests/unit/test_brooks_market_feed.py \
            tests/unit/test_brooks_paper_service.py \
            tests/unit/test_brooks_real_offline_replay.py \
            tests/unit/test_integrated_engine_panel.py \
            tests/unit/test_public_brooks_publication_controls.py
