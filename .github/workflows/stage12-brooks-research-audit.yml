name: Stage 12 Brooks read-only partitioned research cohort integrity

on:
  pull_request:
    paths:
      - "naseri_markets/brooks_stage12_research_audit.py"
      - "naseri_markets/brooks_stage12_cli.py"
      - "tests/unit/test_brooks_stage12_research_audit.py"
      - "docs/STAGE12_BROOKS_OFFLINE_RESEARCH_COHORT_V1.md"
      - ".github/workflows/stage12-brooks-research-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage12-brooks-research-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install offline pinned project dependencies
        run: python -m pip install -e ".[dev]"
      - name: Freeze legacy core, compile and lint Stage12
        run: |
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
          python -m compileall -q \
            naseri_markets/brooks_stage12_research_audit.py \
            naseri_markets/brooks_stage12_cli.py \
            tests/unit/test_brooks_stage12_research_audit.py
          python -m ruff check --select E4,F \
            naseri_markets/brooks_stage12_research_audit.py \
            naseri_markets/brooks_stage12_cli.py \
            tests/unit/test_brooks_stage12_research_audit.py
      - name: Offline Stage12 provenance and Stage 1-11 regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
          MMT_NONPRODUCTION: "1"
        run: |
          python -m pytest -q --confcutdir=tests/unit \
            tests/unit/test_brooks_stage12_research_audit.py \
            tests/unit/test_brooks_stage11_candle_replay.py \
            tests/unit/test_brooks_stage10_paper_bridge.py \
            tests/unit/test_stage10_telegram_paper_view.py \
            tests/unit/test_execution_position_core_v1.py \
            tests/unit/test_risk_portfolio_manager_v1.py \
            tests/unit/test_paper_position_reconciler_v1.py \
            tests/unit/test_brooks_paper_receipts.py \
            tests/unit/test_brooks_real_offline_replay.py \
            tests/unit/test_integrated_engine_panel.py \
            tests/unit/test_brooks_paper_service.py \
            tests/unit/test_public_brooks_publication_controls.py
      - name: No mutable SQLite writes, trading SDK, Telegram or market web routes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = (
              Path("naseri_markets/brooks_stage12_research_audit.py"),
              Path("naseri_markets/brooks_stage12_cli.py"),
          )
          forbidden_calls = {
              "order_send", "order_check", "login", "send_message",
              "publish", "poll_once", "replay_once", "initialize",
              "run_polling", "configure_account", "configure_portfolio",
              "register_instrument", "create", "apply", "executescript",
              "execute_live", "fetch", "post"
          }
          forbidden_imports = {"MetaTrader5", "telegram", "httpx", "requests"}
          for p in paths:
              tree = ast.parse(p.read_text(encoding="utf-8"))
              calls = {
                  x.func.attr for x in ast.walk(tree)
                  if isinstance(x, ast.Call) and isinstance(x.func, ast.Attribute)
              }
              assert not calls.intersection(forbidden_calls), (p, calls)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      assert not forbidden_imports.intersection({
                          a.name for a in node.names
                      }), p
              assert "mode=ro" in p.read_text() if p.name.endswith("audit.py") else True
          print("PASS: Stage12 research reads only local existing data; no execution/publication")
          PY
      - name: Verify installed wheel exposes Stage12 without live dependencies
        run: |
          python scripts/a6_prepare_package.py --destination "$RUNNER_TEMP/stage12-wheel"
          python -m venv "$RUNNER_TEMP/stage12-clean"
          "$RUNNER_TEMP/stage12-clean/bin/python" -m pip install \
            "$RUNNER_TEMP/stage12-wheel[telegram-admin]" >/dev/null
          "$RUNNER_TEMP/stage12-clean/bin/python" - <<'PY'
          from naseri_markets.brooks_stage12_research_audit import (
              evaluate_brooks_stage12, Stage12ResearchRefused,
          )
          from naseri_markets.brooks_stage12_cli import main
          assert callable(evaluate_brooks_stage12)
          assert issubclass(Stage12ResearchRefused, ValueError)
          assert callable(main)
          print("PASS: Stage12 installed in a clean public distribution wheel")
          PY
