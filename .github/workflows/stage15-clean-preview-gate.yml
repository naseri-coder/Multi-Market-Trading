name: Stage 15 isolated preview release source gate

on:
  pull_request:
    paths:
      - "naseri_markets/release_readiness_v1.py"
      - "naseri_markets/paper_demo_cli_v1.py"
      - "tests/unit/test_paper_demo_cli_v1.py"
      - "docs/PAPER_MVP_INSTALLED_USER_JOURNEY_V1.md"
      - "platform_release/pyproject.toml"
      - "platform_release/README.md"
      - "README.md"
      - "naseri_markets/installed_preview_smoke_v1.py"
      - "scripts/mmt_stage15_readiness.py"
      - "tests/unit/test_release_readiness_v1.py"
      - "docs/PRODUCT_READINESS_AND_RELEASE_GATES_STAGE15_V1.md"
      - ".github/workflows/stage15-clean-preview-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-clean-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read-only source audit (NOT public release approval)
        env:
          MMT_NONPRODUCTION: "1"
        run: |
          set -Eeuo pipefail
          python -m scripts.mmt_stage15_readiness --repository . --ack-source-audit > "$RUNNER_TEMP/stage15-source.json"
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/stage15-source.json'))
          assert p['source_verdict']=='SOURCE_PREFLIGHT_PASS'
          assert p['release_verdict']=='PRODUCT_NOT_READY_FOR_PUBLIC_OR_LIVE_RELEASE'
          assert not p['production_deployment_authorized']
          assert not p['telegram_publication_authorized']
          assert not p['live_orders_authorized']
          print('SOURCE_PREFLIGHT_PASS_PUBLIC_RELEASE_BLOCKED')
          PY
      - name: Focused Stage 15 unit and code checks
        run: |
          set -Eeuo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.16.9'
          python -m ruff check --select E4,F \
            naseri_markets/paper_demo_cli_v1.py \
            tests/unit/test_paper_demo_cli_v1.py \
            naseri_markets/release_readiness_v1.py \
            naseri_markets/installed_preview_smoke_v1.py \
            scripts/mmt_stage15_readiness.py \
            tests/unit/test_release_readiness_v1.py
          mkdir -p "$RUNNER_TEMP/stage15-standalone-tests"
          cp tests/unit/test_release_readiness_v1.py "$RUNNER_TEMP/stage15-standalone-tests/"
          cp tests/unit/test_paper_demo_cli_v1.py "$RUNNER_TEMP/stage15-standalone-tests/"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q "$RUNNER_TEMP/stage15-standalone-tests"
      - name: Clean-wheel installation and synthetic decision smoke only
        env:
          MMT_NONPRODUCTION: "1"
        run: |
          set -Eeuo pipefail
          project="$RUNNER_TEMP/platform-copy"
          mkdir -p "$project" "$RUNNER_TEMP/wheels" "$RUNNER_TEMP/cleanroom"
          cp platform_release/pyproject.toml platform_release/README.md "$project/"
          cp -a naseri_markets "$project/naseri_markets"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" "$project"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/multi_market_trading-0.4.0rc1-*.whl
          "$RUNNER_TEMP/venv/bin/python" -m pip check
          cd "$RUNNER_TEMP/cleanroom"
          PYTHONPATH= "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import naseri_markets
          import sys
          from pathlib import Path
          installed = Path(naseri_markets.__file__).resolve()
          venv = Path(sys.prefix).resolve()
          assert venv in installed.parents
          assert Path(__file__).resolve() != installed
          print("CLEAN_WHEEL_IMPORT_PROVENANCE_PASS")
          PY
          PYTHONPATH= "$RUNNER_TEMP/venv/bin/python" -m naseri_markets.installed_preview_smoke_v1 --ack-isolated-preview > "$RUNNER_TEMP/smoke.json"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/smoke.json'))
          assert p['strategy_decision_validated'] is True
          assert p['scope']=='ISOLATED_INSTALLED_WHEEL_SYNTHETIC_ONLY'
          assert p['telegram_sent'] is False and p['broker_order_sent'] is False
          assert p['product_release_authorized'] is False
          print('ISOLATED_PREVIEW_WHEEL_SMOKE_PASS_PUBLIC_RELEASE_BLOCKED')
          PY

      - name: Real installed public toy PAPER lifecycle (no network/orders)
        env:
          MMT_NONPRODUCTION: "1"
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/cleanroom"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          home = Path(os.environ["RUNNER_TEMP"])
          tool = home / "venv/bin/naseri-paper-demo"
          state = home / "toy-private-state"
          environment = dict(os.environ, PYTHONPATH="")
          def invoke(action, *args):
              process = subprocess.run(
                  [str(tool), "--state-dir", str(state), action, *args],
                  cwd=home / "cleanroom", env=environment,
                  capture_output=True, text=True, timeout=20, check=True)
              return json.loads(process.stdout)

          def refuse(action, *args):
              proc = subprocess.run(
                  [str(tool), "--state-dir", str(state), action, *args],
                  cwd=home / "cleanroom", env=environment,
                  capture_output=True, text=True, timeout=20, check=False,
              )
              assert proc.returncode == 2, (proc.returncode, proc.stderr)
              assert not proc.stdout
              assert proc.stderr.startswith("PAPER_DEMO_REFUSED:")

          refuse("init")  # no consent, no directory created
          assert not state.exists()
          original = invoke("init", "--ack-reviewed-public-toy")
          assert original["revision"] == 1 and not original["enabled"]
          assert state.stat().st_mode & 0o777 == 0o700
          ledger = state / "custom_paper.db"
          assert ledger.stat().st_mode & 0o777 == 0o600
          linked = home / "hardlinked-ledger.db"
          os.link(ledger, linked)
          try:
              refuse("inspect")  # no second file identity allowed
          finally:
              linked.unlink()
          assert invoke("inspect")["paper_signal_count"] == 0
          assert not original["telegram_sent"] and not original["broker_order_sent"]
          enabled = invoke("enable", "--revision", "1",
                           "--descriptor-sha256", original["descriptor_sha256"])
          assert enabled["enabled"] and enabled["revision"] == 2
          first = invoke("replay", "--ack-offline-replay")
          again = invoke("replay", "--ack-offline-replay")
          assert first["receipt"]["result"] == "RECORDED"
          assert again["receipt"]["result"] == "DUPLICATE"
          assert first["paper_signal_count"] == again["paper_signal_count"] == 1
          assert first["journal_sha256"] == again["journal_sha256"]
          reopened = invoke("inspect")
          assert reopened["paper_signal_count"] == 1
          assert reopened["journal_sha256"] == first["journal_sha256"]
          disabled = invoke("disable", "--revision", "2")
          assert not disabled["enabled"] and disabled["revision"] == 3
          assert disabled["paper_signal_count"] == 1
          assert not disabled["release_authorized"]
          assert not disabled["telegram_sent"] and not disabled["broker_order_sent"]
          state.chmod(0o755)
          try:
              refuse("inspect")  # reject a weakened private directory
          finally:
              state.chmod(0o700)
          ledger.chmod(0o644)
          try:
              refuse("inspect")  # reject shared SQLite permissions
          finally:
              ledger.chmod(0o600)
          assert invoke("inspect")["journal_sha256"] == first["journal_sha256"]
          denied = subprocess.run(
              [str(tool), "--state-dir", str(state), "replay",
               "--ack-offline-replay"],
              cwd=home / "cleanroom", env=environment,
              capture_output=True, timeout=20, check=False)
          assert denied.returncode == 2
          print("INSTALLED_PUBLIC_TOY_PAPER_MVP_PASS_PUBLIC_RELEASE_BLOCKED")
          PY
