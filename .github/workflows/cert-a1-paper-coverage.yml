name: MMT CERT-A1 cross-format PAPER capability audit only

on:
  pull_request:
    paths:
      - "naseri_markets/cert_a1_paper_format_inventory.py"
      - "tests/unit/test_cert_a1_paper_format_inventory.py"
      - "docs/MMT_CERT_A1_PAPER_FORMAT_COVERAGE.md"
      - ".github/workflows/cert-a1-paper-coverage.yml"
      - "naseri_markets/cert_a1_offline_candidate_review.py"
      - "naseri_markets/runtime_a6_dispatch_fence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cert-a1-inert-paper-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/production_source:${{ github.workspace }}
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned offline test tooling
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            pyarrow==21.0.0 ruff==0.16.9 pydantic-settings==2.15.0
      - name: Verify each format stays strictly PAPER non-executable
        run: |
          set -Eeuo pipefail
          python -m ruff check \
            naseri_markets/cert_a1_paper_format_inventory.py \
            tests/unit/test_cert_a1_paper_format_inventory.py
          python -m pytest -q -ra \
            tests/unit/test_cert_a1_paper_format_inventory.py \
            tests/unit/test_cert_a1_offline_candidate_review.py \
            tests/unit/test_pine_a1_sma_cross_parity.py \
            tests/unit/test_native_a1_inert_binary_preflight.py \
            tests/unit/test_runtime_a6_dispatch_fence.py \
            | tee "$RUNNER_TEMP/cert-a1-paper-coverage.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/cert-a1-paper-coverage.log"; then
            echo "CERT_A1_SKIPPED_SECURITY_REGRESSION" >&2
            exit 1
          fi
