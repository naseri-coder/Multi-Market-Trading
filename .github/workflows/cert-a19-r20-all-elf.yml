name: CERT-A19-R20 all 36 pinned Wolfi APK ELF static audit (research only)

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r20-all-elf.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect-whole-R18-ELF-closure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cert-a19-byte-audit-run' && github.repository == 'naseri-coder/Multi-Market-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned R18/R19 evidence with exact sha256, no mutable registry metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/cert-a19-r20"
          mkdir -m 0700 "$work"
          mkdir "$work/r18artifact" "$work/r19artifact"
          gh run download 38642890495 \
            --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r18-apko-signed-offline-closure-audit \
            --dir "$work/r18artifact"
          gh run download 38645056701 \
            --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r19-ts-wasmtime-elf-static-evidence \
            --dir "$work/r19artifact"
          cp "$work/r18artifact/APKINDEX.tar.gz" "$work/APKINDEX.tar.gz"
          cp "$work/r18artifact/r18-result.json" "$work/r18-result.json"
          cp "$work/r19artifact/r19-report.json" "$work/r19-report.json"
          echo '8011fbdaf70278ae83e3729dc2c44a8148a91cf03ea0ef7a3d049e30a65e36a5  '"$work/APKINDEX.tar.gz" | sha256sum --check --status
          echo '78356a69bf4c7aa50856450b1b4f55f9aaaf4909072891909a9fe73697fd139b  '"$work/r18-result.json" | sha256sum --check --status
          echo 'aeacd3dee432ebbebd2bf3b94f41b13aff5c94bd7eb34dcd16814ad4c6166d55  '"$work/r19-report.json" | sha256sum --check --status
          echo R20_R18_R19_SIGNED_HISTORIC_SOURCE_PROOF_BYTES_MATCH
      - name: Scan each ELF of ALL 36 APKs with trusted readelf, no imported ELF/Worker execution
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v readelf
          python3 -u -m scripts.ci_cert_a19_r20_full_elf
          test -s "$RUNNER_TEMP/cert-a19-r20/r20-static-all-elf.json"
          sha256sum "$RUNNER_TEMP/cert-a19-r20/r20-static-all-elf.json"
      - name: Preserve static inventory and honest missing ELF names without storing APK executable files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r20-36-apk-all-elf-static-audit
          path: |
            ${{ runner.temp }}/cert-a19-r20/r20-static-all-elf.json
          if-no-files-found: ignore
          retention-days: 2
