name: Full Corpus - Disposable PostgreSQL

on:
  pull_request:
    branches:
      - develop/v0.3.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ch6-full-corpus-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      PTB_TIMEDELTA: "1"
      APP_ENV: test
      TELEGRAM_RUNTIME_ENABLED: "false"
      BROOKS_RUNTIME_ENABLED: "false"
      BROOKS_OPERATIONS_ENABLED: "false"
      PAPER_RUNTIME_ENABLED: "false"
      PERFORMANCE_REPORTS_ENABLED: "false"
      DB_ECHO: "false"

    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize isolated source
        run: |
          set -Eeuo pipefail
          root="/tmp/ch6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_dir="${root}/repo"
          socket_dir="${root}/socket"
          pg_container="ch6-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          test "${root}" != "/tmp/ch6-"
          mkdir -p "${source_dir}" "${socket_dir}"
          chmod 0777 "${socket_dir}"
          tar --exclude=.git -cf - . | tar -xf - -C "${source_dir}"

          {
            echo "CH6_ISOLATED_ROOT=${root}"
            echo "CH6_ISOLATED_SOURCE=${source_dir}"
            echo "CH6_SOCKET_DIR=${socket_dir}"
            echo "CH6_PG_CONTAINER=${pg_container}"
          } >> "${GITHUB_ENV}"

      - name: Install isolated checkout
        run: |
          set -Eeuo pipefail
          cd "${CH6_ISOLATED_SOURCE}"
          python -m pip install -e ".[dev]"
          cp -a production_source/app ./app
          cp -a production_source/migrations ./migrations
          cp production_source/alembic.ini ./alembic.ini

          PYTHONPATH="${CH6_ISOLATED_SOURCE}" python - <<'PY'
          from pathlib import Path
          import os
          import app

          source = Path(os.environ["CH6_ISOLATED_SOURCE"]).resolve()
          resolved = Path(app.__file__).resolve()
          assert resolved.is_relative_to(source), (resolved, source)
          print("CH6_ISOLATED_SOURCE_PASS")
          PY

      - name: Start two isolated disposable PostgreSQL databases
        run: |
          set -Eeuo pipefail
          pg_user="ch6synthetic"
          ch6_db="ch6synthetic"
          general_db="fullcorpus"
          pg_password="ch6synthetic_ci_password_2026"

          docker run -d --rm --name "${CH6_PG_CONTAINER}" --security-opt no-new-privileges:true -e "POSTGRES_USER=${pg_user}" -e "POSTGRES_PASSWORD=${pg_password}" -e "POSTGRES_DB=${ch6_db}" -v "${CH6_SOCKET_DIR}:/var/run/postgresql" postgres:16-alpine -c unix_socket_directories=/var/run/postgresql -c listen_addresses=''

          ready=0
          for _ in {1..60}; do
            if docker exec "${CH6_PG_CONTAINER}" pg_isready -U "${pg_user}" -d "${ch6_db}" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" = "1"

          docker exec "${CH6_PG_CONTAINER}" createdb -U "${pg_user}" "${general_db}"

          ch6_url="postgresql+asyncpg://${pg_user}:${pg_password}@localhost/${ch6_db}?host=${CH6_SOCKET_DIR}"
          general_url="postgresql+asyncpg://${pg_user}:${pg_password}@localhost/${general_db}?host=${CH6_SOCKET_DIR}"

          case "${ch6_url}" in
            *ch6synthetic*"/tmp/ch6-"*) ;;
            *) echo "CH6_DATABASE_URL_ISOLATION_FAIL"; exit 1 ;;
          esac
          case "${general_url}" in
            *fullcorpus*"/tmp/ch6-"*) ;;
            *) echo "GENERAL_DATABASE_URL_ISOLATION_FAIL"; exit 1 ;;
          esac

          {
            echo "CH6_DISPOSABLE_DATABASE_URL=${ch6_url}"
            echo "TEST_DATABASE_URL=${general_url}"
            echo "DATABASE_URL=${ch6_url}"
          } >> "${GITHUB_ENV}"

          test -z "$(docker port "${CH6_PG_CONTAINER}")"
          echo "DISPOSABLE_POSTGRES_TWO_DATABASES_PASS"

      - name: Apply GitHub migrations to both disposable databases
        run: |
          set -Eeuo pipefail
          cd "${CH6_ISOLATED_SOURCE}"
          export PYTHONPATH="${CH6_ISOLATED_SOURCE}"

          python -m alembic -c alembic.ini heads | grep -F "20260928_0021"

          DATABASE_URL="${CH6_DISPOSABLE_DATABASE_URL}" python -m alembic -c alembic.ini upgrade 20260928_0021
          DATABASE_URL="${TEST_DATABASE_URL}" python -m alembic -c alembic.ini upgrade 20260928_0021

          ch6_current="$(docker exec "${CH6_PG_CONTAINER}" psql -U ch6synthetic -d ch6synthetic -Aqt -c 'SELECT version_num FROM alembic_version;')"
          general_current="$(docker exec "${CH6_PG_CONTAINER}" psql -U ch6synthetic -d fullcorpus -Aqt -c 'SELECT version_num FROM alembic_version;')"
          test "${ch6_current}" = "20260928_0021"
          test "${general_current}" = "20260928_0021"
          echo "BOTH_DATABASES_MIGRATION_0021_PASS"

      - name: Run complete tracked corpus
        run: |
          set -Eeuo pipefail
          cd "${CH6_ISOLATED_SOURCE}"
          export PYTHONPATH="${CH6_ISOLATED_SOURCE}"
          python -m pytest -q

      - name: Cleanup disposable resources
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail

          if [[ -n "${CH6_PG_CONTAINER:-}" ]]; then
            docker rm -f "${CH6_PG_CONTAINER}" >/dev/null 2>&1 || true
          fi

          if [[ -n "${CH6_ISOLATED_ROOT:-}" && "${CH6_ISOLATED_ROOT}" == /tmp/ch6-* ]]; then
            docker run --rm --entrypoint sh -v "${CH6_ISOLATED_ROOT}:/cleanup" postgres:16-alpine -c 'rm -rf /cleanup/repo /cleanup/socket'
            rmdir -- "${CH6_ISOLATED_ROOT}"
            test ! -e "${CH6_ISOLATED_ROOT}"
          fi

          echo "DISPOSABLE_RESOURCE_CLEANUP_PASS"
