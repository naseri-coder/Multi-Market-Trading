name: CERT-A19-R23 signed apko nonproduction 36-APK minirootfs composition

on:
  push:
    branches: [cert-a19-byte-audit-run]
    paths:
      - ".github/workflows/cert-a19-r23-minirootfs.yml"

permissions:
  contents: read
  actions: read

jobs:
  one_ephemeral_package_only_rootfs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cert-a19-byte-audit-run' && github.repository == 'naseri-coder/Multi-Market-Trading'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Restore original frozen R18 and R22 evidence byte-for-byte
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r23"
          mkdir -m 0755 "$d"
          mkdir -p "$d/r18" "$d/r22" "$d/keys" "$d/tool" "$d/output"
          gh run download 38642890495 --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r18-apko-signed-offline-closure-audit --dir "$d/r18"
          gh run download 38649169689 --repo naseri-coder/Multi-Market-Trading \
            --name cert-a19-r22-loader-byte-parity-and-collision-review --dir "$d/r22"
          cp "$d/r18/APKINDEX.tar.gz" "$d/APKINDEX.tar.gz"
          cp "$d/r18/r18-result.json" "$d/r18-result.json"
          cp "$d/r22/r22-loader-and-conflicts.json" "$d/r22-loader-and-conflicts.json"
          echo '8011fbdaf70278ae83e3729dc2c44a8148a91cf03ea0ef7a3d049e30a65e36a5  '"$d/APKINDEX.tar.gz" | sha256sum --check --status
          echo '78356a69bf4c7aa50856450b1b4f55f9aaaf4909072891909a9fe73697fd139b  '"$d/r18-result.json" | sha256sum --check --status
          echo '41cefc3fc5e72ca023b3f915b5605b9dd950f24860d313c37de56309d67efec7  '"$d/r22-loader-and-conflicts.json" | sha256sum --check --status
          echo R23_HISTORIC_SIGNED_INDEX_AND_TWO_REPORTS_MATCHED
      - name: Verify signed Wolfi base identity and copy only public package trust keys without starting it
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r23"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$image" > "$d/base-cosign.json"
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create --pull=never --platform linux/amd64 --entrypoint=/bin/true "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          docker cp "$cid:/etc/apk/keys/." "$d/keys/"
          docker cp "$cid:/etc/apk/repositories" "$d/base-repositories.txt"
          grep -Fx 'https://apk.cgr.dev/chainguard' "$d/base-repositories.txt"
          test "$(docker inspect "$cid" --format '{{.State.Status}}')" = created
          find "$d/keys" -type d -exec chmod 755 {} +
          find "$d/keys" -type f -name '*.pub' -exec chmod 644 {} +
          echo SIGNED_BASE_KEYS_COPIED_FROM_STOPPED_IMAGE
      - name: Verify apko 1.4.11 signed release before executing any package-manager code
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r23"
          prefix='https://github.com/chainguard-dev/apko/releases/download/v1.4.11/apko_1.4.11_linux_amd64.tar.gz'
          for tail in '' .crt .sig; do
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              --retry 1 --connect-timeout 15 --max-time 90 "$prefix$tail" \
              -o "$d/apko-release.tar.gz$tail"
          done
          echo '5445ea2467a4ab0db3e31d9f795133128d0564c7afdaa46fcdaa1ee3cf92c757  '"$d/apko-release.tar.gz" | sha256sum --check --status
          cosign verify-blob \
            --certificate "$d/apko-release.tar.gz.crt" --signature "$d/apko-release.tar.gz.sig" \
            --certificate-identity='https://github.com/chainguard-dev/apko/.github/workflows/release.yaml@refs/heads/main' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "$d/apko-release.tar.gz" > "$d/apko-signature-proof.txt"
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          d=Path(os.environ["RUNNER_TEMP"])/"cert-a19-r23"
          with tarfile.open(d/"apko-release.tar.gz","r:gz") as t:
            candidates=[m for m in t if m.isfile() and PurePosixPath(m.name).name=="apko"]
            if len(candidates)!=1 or not 15_000_000<candidates[0].size<150_000_000:
              raise ValueError("R23_SIGNED_BINARY_MISSING_OR_UNBOUNDED")
            f=t.extractfile(candidates[0])
            if f is None:raise ValueError("R23_BINARY_UNREADABLE")
            data=f.read(150_000_001)
            if len(data)!=candidates[0].size:raise ValueError("R23_TRUNCATED_RELEASE_BINARY")
            target=d/"tool"/"apko"
            target.write_bytes(data)
            target.chmod(0o755)
          PY
          echo R23_APKO_OFFICIAL_RELEASE_SIGNED_SHA256_PASS
      - name: Verify and stage exact 36 APK archives with original signed local index and package-control/data hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -u -m scripts.ci_cert_a19_r23_package_composition prepare
          test -s "$RUNNER_TEMP/cert-a19-r23/prepared.json"
          chmod 777 "$RUNNER_TEMP/cert-a19-r23/output"
      - name: Use verified apko to compose ONLY disposable package-only minirootfs under restricted, no-network container
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r23"
          image='cgr.dev/chainguard/wolfi-base@sha256:256c88bb066424045021090932d50be93c8e3f2ce3586707702a401b146f3e43'
          docker run --rm --pull=never --platform linux/amd64 \
            --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=80 --memory=1250m --cpus=2 \
            --user=65534:65534 --env HOME=/tmp --env TMPDIR=/tmp \
            --tmpfs /tmp:rw,nosuid,noexec,size=450m,mode=1777 \
            --mount type=bind,src="$d",dst=/work,readonly \
            --mount type=bind,src="$d/output",dst=/work/output \
            --entrypoint /work/tool/apko "$image" \
            build-minirootfs --build-arch x86_64 --build-date 2026-10-14T00:00:00Z \
            /work/candidate.yaml /work/output/nonproduction-minirootfs.tar.gz \
            > "$d/apko-build-stdout.log" 2> "$d/apko-build-stderr.log" || {
              echo R23_APKO_PACKAGE_COMPOSITION_REJECTED_NEVER_DECLARE_PASS
              tail -n 75 "$d/apko-build-stderr.log" >&2
              exit 1
            }
          test -s "$d/output/nonproduction-minirootfs.tar.gz"
          test "$(stat -c%s "$d/output/nonproduction-minirootfs.tar.gz")" -lt 300000000
          echo R23_DISPOSABLE_PACKAGE_ONLY_ROOTFS_COMPOSED_NO_GUEST_EXECUTION
      - name: Statistically inspect final minirootfs, exact installed DB, usr-lib64, loader bytes and clear
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m scripts.ci_cert_a19_r23_package_composition inspect
          test -s "$RUNNER_TEMP/cert-a19-r23/r23-package-only-rootfs.json"
      - name: Archive evidence only, not package archives, ELF, container or minirootfs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cert-a19-r23-signed-apko-package-only-composition
          path: |
            ${{ runner.temp }}/cert-a19-r23/prepared.json
            ${{ runner.temp }}/cert-a19-r23/r23-package-only-rootfs.json
            ${{ runner.temp }}/cert-a19-r23/apko-build-stderr.log
          if-no-files-found: ignore
          retention-days: 2
      - name: Delete disposable rootfs tar and package input files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          d="$RUNNER_TEMP/cert-a19-r23"
          if test -d "$d/output"; then find "$d/output" -maxdepth 1 -type f -delete; fi
          if test -d "$d/localrepo/x86_64"; then find "$d/localrepo/x86_64" -maxdepth 1 -type f -name '*.apk' -delete; fi
          echo R23_ONLY_REPORTS_RETAINED_NO_WORKER_NO_PRODUCTION
