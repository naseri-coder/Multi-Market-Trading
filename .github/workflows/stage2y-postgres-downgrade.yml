name: Stage 2Y - isolated PostgreSQL downgrade acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-postgresql-downgrade:
    name: PG16 empty rollback and nonempty archive refusal
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      APP_ENV: test
      TELEGRAM_RUNTIME_ENABLED: "false"
      BROOKS_RUNTIME_ENABLED: "false"
      BROOKS_OPERATIONS_ENABLED: "false"
      PAPER_RUNTIME_ENABLED: "false"
      PERFORMANCE_REPORTS_ENABLED: "false"
      DB_ECHO: "false"

    steps:
      - name: Checkout exact candidate source with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize a fresh nonproduction checkout
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d /tmp/mmt-stage2y-XXXXXXXX)"
          chmod 0755 "$root"
          mkdir -p "$root/source" "$root/socket"
          chmod 0777 "$root/socket"
          tar --exclude=.git -cf - . | tar -xf - -C "$root/source"
          {
            echo "STAGE2Y_ROOT=$root"
            echo "STAGE2Y_SOURCE=$root/source"
            echo "STAGE2Y_SOCKET=$root/socket"
          } >> "$GITHUB_ENV"
          echo "STAGE2Y_DISPOSABLE_CHECKOUT_READY"

      - name: Install source dependencies and canonical migration tree
        run: |
          set -Eeuo pipefail
          cd "$STAGE2Y_SOURCE"
          python -m pip install --disable-pip-version-check -e .
          bash scripts/verify.sh
          cp -a production_source/app ./app
          cp -a production_source/migrations ./migrations
          cp production_source/alembic.ini ./alembic.ini
          test -f migrations/versions/20261013_0023_retire_legacy_routes.py
          grep -Fq NONEMPTY_STRATEGY_ARCHIVE_DOWNGRADE_REFUSED migrations/versions/20261013_0023_retire_legacy_routes.py
          echo "STAGE2Y_SOURCE_AND_MIGRATION_GUARD_READY"

      - name: Provision native PostgreSQL 16 with UNIX socket only
        run: |
          set -Eeuo pipefail
          psql --version | grep -E '^psql \(PostgreSQL\) 16\.'
          test -f /etc/postgresql/16/main/pg_hba.conf
          sudo python3 - "$STAGE2Y_SOCKET" <<'PY'
          import sys
          from pathlib import Path

          socket_dir = Path(sys.argv[1]).resolve()
          assert socket_dir.name == "socket"
          assert socket_dir.parent.name.startswith("mmt-stage2y-")
          assert socket_dir.parent.parent == Path("/tmp")
          conf = Path("/etc/postgresql/16/main/postgresql.conf")
          hba = Path("/etc/postgresql/16/main/pg_hba.conf")
          conf.write_text(conf.read_text() + f"\nlisten_addresses = ''\nunix_socket_directories = '{socket_dir}'\n")
          hba.write_text("local all postgres peer\nlocal all stage2y_scratch scram-sha-256\n" + hba.read_text())
          PY
          sudo pg_ctlcluster 16 main start
          pass="$(openssl rand -hex 24)"
          sudo -u postgres psql -h "$STAGE2Y_SOCKET" -v ON_ERROR_STOP=1 -c "CREATE ROLE stage2y_scratch LOGIN CREATEDB PASSWORD '$pass'"
          sudo -u postgres createdb -h "$STAGE2Y_SOCKET" -O stage2y_scratch stage2y_empty
          sudo -u postgres createdb -h "$STAGE2Y_SOCKET" -O stage2y_scratch stage2y_legacy
          export PGPASSWORD="$pass"
          test "$(psql -h "$STAGE2Y_SOCKET" -U stage2y_scratch -d stage2y_empty -Atqc 'SELECT 1')" = "1"
          test "$(psql -h "$STAGE2Y_SOCKET" -U stage2y_scratch -d stage2y_legacy -Atqc 'SELECT 1')" = "1"
          test "$(sudo -u postgres psql -h "$STAGE2Y_SOCKET" -Atqc 'SHOW listen_addresses')" = ""
          test -z "$(sudo ss -lntp | grep -E ':(5432)\b' || true)"
          {
            echo "STAGE2Y_PGPASSWORD=$pass"
            echo "STAGE2Y_EMPTY_URL=postgresql+asyncpg://stage2y_scratch:$pass@localhost/stage2y_empty?host=$STAGE2Y_SOCKET"
            echo "STAGE2Y_LEGACY_URL=postgresql+asyncpg://stage2y_scratch:$pass@localhost/stage2y_legacy?host=$STAGE2Y_SOCKET"
          } >> "$GITHUB_ENV"
          echo "STAGE2Y_NATIVE_PG16_SOCKET_ONLY_PASS"

      - name: Execute actual schema downgrade and archive preservation gates
        run: |
          set -Eeuo pipefail
          cd "$STAGE2Y_SOURCE"
          export PYTHONPATH="$STAGE2Y_SOURCE"
          bash scripts/ci_stage2y_pg_downgrade.sh

      - name: Remove only disposable runner resources
        if: always()
        run: |
          set -Eeuo pipefail
          sudo pg_ctlcluster 16 main stop || true
          if [[ -n "${STAGE2Y_ROOT:-}" && "$STAGE2Y_ROOT" == /tmp/mmt-stage2y-* ]]; then
            rm -rf -- "$STAGE2Y_ROOT"
            test ! -e "$STAGE2Y_ROOT"
          fi
          echo "STAGE2Y_EPHEMERAL_CLEANUP_PASS"
