name: MMT NATIVE-A1 static PE and ELF admission only

on:
  pull_request:
    paths:
      - "naseri_markets/native_a1_inert_binary_preflight.py"
      - "tests/unit/test_native_a1_inert_binary_preflight.py"
      - "docs/MMT_NATIVE_A1_INERT_PE_ELF_PREFLIGHT.md"
      - ".github/workflows/native-a1-binary-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-native-binary-review-no-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/production_source:${{ github.workspace }}
      MMT_NONPRODUCTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned mock-only test tools without native runners
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pytest-asyncio==1.4.0 \
            ruff==0.16.9 pydantic-settings==2.15.0
      - name: Verify PE and ELF binary structure, non-execution and A6 denial
        run: |
          set -Eeuo pipefail
          python -m ruff check \
            naseri_markets/native_a1_inert_binary_preflight.py \
            tests/unit/test_native_a1_inert_binary_preflight.py
          python -m pytest -q -ra \
            tests/unit/test_native_a1_inert_binary_preflight.py \
            tests/unit/test_universal_artifact_intake_v1.py \
            tests/unit/test_runtime_a6_dispatch_fence.py
