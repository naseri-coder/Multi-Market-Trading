name: A19 Multi Market Trading offline UID, seccomp and cgroup policy

on:
  push:
    branches: [feature/a19-offline-uid-seccomp-cgroup-policy]
  pull_request:
    paths:
      - "naseri_markets/a19_hardening.py"
      - "tests/unit/test_a19_hardening.py"
      - "docs/MULTI_MARKET_TRADING_A19_HARDENING.md"
      - ".github/workflows/a19-offline-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonproduction-kernel-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Historical v0.3.2 source freeze, repository public preflight
        run: |
          set -Eeuo pipefail
          bash scripts/verify.sh
          python scripts/a6_release_preflight.py
          test -f /sys/fs/cgroup/cgroup.controllers
          test -x /usr/bin/systemd-analyze
          test -x /usr/bin/sudo
          test -x /usr/bin/python3
          ldconfig -p | grep -F 'libseccomp.so.2'
      - name: Verified distinct nonroot UID default-deny seccomp and unit syntax
        run: |
          set -Eeuo pipefail
          python -m pip install -e ".[dev]"
          python -m pip install "cryptography==46.0.3"
          python -m pytest -q \
            tests/unit/test_a19_hardening.py \
            tests/unit/test_a18_guardian.py \
            tests/unit/test_a17_watchdog.py \
            tests/unit/test_a16_supervisor.py \
            tests/unit/test_a15_releases.py \
            tests/unit/test_a14_packages.py \
            tests/unit/test_a13_provisioning.py \
            tests/unit/test_a12_trust.py
      - name: Strict lint and no strategy import or privileged host mutation
        run: |
          set -Eeuo pipefail
          python -m ruff check --select E4,F \
            naseri_markets/a19_hardening.py tests/unit/test_a19_hardening.py
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("naseri_markets/a19_hardening.py")
          source = path.read_text()
          tree = ast.parse(source)
          forbidden = {"MetaTrader5", "r0_engine", "private_nyfr_core",
                       "requests", "httpx", "aiohttp", "importlib"}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  assert all(n.name.split(".")[0] not in forbidden for n in node.names)
              if isinstance(node, ast.ImportFrom):
                  assert (node.module or "").split(".")[0] not in forbidden
          assert "shell=True" not in source
          assert "systemctl" not in source
          assert "Ed25519PrivateKey" not in source
          assert "production_source" not in source
          print("A19_NO_PRIVATE_SOURCE_OR_HOST_SERVICE_MUTATION_PASS")
          PY
      - name: Public-only isolated distribution including offline hardening preview
        run: |
          set -Eeuo pipefail
          python -m pip install "setuptools==80.9.0" "wheel==0.45.1"
          python scripts/a6_prepare_package.py --destination "$RUNNER_TEMP/a19-wheel"
          test -f "$RUNNER_TEMP/a19-wheel/naseri_markets/a19_hardening.py"
          test ! -e "$RUNNER_TEMP/a19-wheel/naseri_markets/private_nyfr_core.py"
          test ! -e "$RUNNER_TEMP/a19-wheel/naseri_markets/r0_engine.py"
          echo "A19_PUBLIC_ONLY_FIXTURE_PREVIEW_PASS"
