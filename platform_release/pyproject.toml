[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-market-trading"
version = "0.4.0rc1"
description = "NASERI MARKETS public strategy-neutral offline multi-market platform preview"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
telegram-admin = ["python-telegram-bot==22.8"]
# Optional *frozen legacy runtime* compatibility closure. The historical
# Brooks V5 import graph traverses old DB, config, and Telegram modules even
# for a strictly offline evaluation. Pin to root 0.3.2 dependencies without
# bundling its Python source into the new platform wheel. Base remains empty.
brooks-offline = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.8",
    "SQLAlchemy[asyncio]==2.0.54",
    "tzdata==2026.4",
]

[project.scripts]
naseri-markets = "naseri_markets.platform_cli:main"
naseri-custom = "naseri_markets.custom_cli:main"
naseri-paper-demo = "naseri_markets.paper_demo_cli_v1:main"
naseri-paper-pilot = "naseri_markets.installed_paper_pilot_stage10_v1:main"
naseri-engine-admin = "naseri_markets.bot_admin_app:main"
naseri-brooks-replay = "naseri_markets.brooks_replay:main"
naseri-brooks-market = "naseri_markets.brooks_market_feed:main"
naseri-brooks-kraken-paper = "naseri_markets.brooks_kraken_feed:main"
naseri-brooks-paper-service = "naseri_markets.brooks_paper_service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["naseri_markets", "naseri_markets.*"]
