# v0.3.0 release-candidate install: fresh, separate host only.
name: crypto-price-action
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Deliberately no host port publication.
  bot:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        RELEASE_VERSION: "0.3.0"
    image: crypto-price-action:${RELEASE_TAG:-v0.3.0-rc1}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
